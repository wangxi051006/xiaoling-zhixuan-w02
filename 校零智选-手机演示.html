<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校零智选 · 交互演示（手账）</title>
<style>
/* ==========================================================================
   校零智选 · 手账风格交互演示
   ========================================================================== */
:root{
  --paper:#FBF5EA;
  --card:#FFFDF8;
  --ink:#2E2A24;
  --mu:#70665B;
  --red:#D9603A;
  --red-action:#A63C25;
  --green:#35664F;
  --butter:#F0C24E;
  --line:rgba(46,42,36,.12);
  --shadow:0 16px 30px -26px rgba(70,52,24,.9);
  --serif:"Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:#ECEFE7;
  color:var(--ink);min-height:100vh;
  font-family:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
ul{list-style:none}
a{color:inherit;text-decoration:none}

/* ---------------- 页面框架 ---------------- */
.page{max-width:450px;margin:0 auto;padding:0 10px 20px}
.masthead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #CFD7CB}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--green);color:#FFFDF8;display:grid;place-items:center;font:700 20px var(--serif)}
.brand b{display:block;font-size:17px}
.brand small{display:block;font-size:11px;color:var(--mu);margin-top:3px}
.switcher{display:flex;gap:4px;order:3;width:100%;background:#DFE6DC;padding:4px;border-radius:12px}
.sw{font-size:13px;min-height:42px;padding:8px 6px;border-radius:8px;color:#385449;display:flex;flex:1;align-items:center;justify-content:center;gap:7px;transition:.2s}
.sw i{font-style:normal;font-size:10px}
.sw:hover{background:#F8FAF3}
.sw.on{background:var(--green);color:#FFFDF8;font-weight:700}
.reset{margin-left:auto;font-size:12px;color:#385449;border:1px solid #B4C3B6;padding:0 12px;min-height:44px;border-radius:8px}
.reset:hover{background:#F8FAF3}

.body{padding-top:12px}
.stage{display:flex;flex-direction:column;align-items:center}
.stage-hint{font-size:12px;color:var(--mu);margin-top:12px;text-align:center}

/* ---------------- 手机外壳 ---------------- */
.device{position:relative;width:100%;height:clamp(430px,calc(100dvh - 154px),848px);border-radius:16px;overflow:hidden;
  background:var(--paper);border:1px solid #CBC7B9;box-shadow:0 18px 36px -28px #3E493C}
.island,.sb,.homebar{display:none!important}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;isolation:isolate}
.screen.enter{animation:screenIn .26s cubic-bezier(.22,.9,.24,1)}
@keyframes screenIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

.veil{position:absolute;inset:0;background:rgba(30,24,16,.38);opacity:0;pointer-events:none;transition:.22s;z-index:60}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;padding:12px 18px 22px;
  transform:translateY(104%);transition:transform .3s cubic-bezier(.22,.9,.24,1);z-index:61;max-height:76%;overflow:auto;
  box-shadow:0 -20px 40px -30px rgba(0,0,0,.6)}
.sheet{visibility:hidden;pointer-events:none}
.sheet.on{transform:none;visibility:visible;pointer-events:auto}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:rgba(46,42,36,.16);margin:0 auto 14px}
.sheet h3{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:4px}
.sheet .sub{font-size:10.5px;color:var(--mu);margin-bottom:14px}
.toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,12px);background:#2E2A24;color:#FFF7E9;
  font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.24s;z-index:70;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------------- 屏内基础 ---------------- */
.sb{flex:0 0 auto;height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 27px 6px;font-size:13px;font-weight:600;letter-spacing:.01em}
.sb-r{display:flex;align-items:center;gap:5px}
.sb-r svg{display:block}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:12px 16px 18px;scrollbar-width:thin}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 22px}
.h-serif{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
.muted{color:var(--mu)}
.small{font-size:10px}
.row-between{display:flex;align-items:center;justify-content:space-between}

/* 顶部问候 */
.hello{display:flex;align-items:flex-start;justify-content:space-between;padding-top:2px}
.hello .k{font-size:10.5px;color:var(--mu);letter-spacing:.04em}
.hello b{display:block;font-size:21px;margin-top:5px;font-family:var(--serif);font-weight:600}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green);color:#FFF7E9;display:grid;place-items:center;font-size:14px;position:relative}
.avatar::after{content:"";position:absolute;inset:-4px;border:1px dashed rgba(53,102,79,.4);border-radius:50%}

/* 地址胶囊 */
.loc{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:10.5px;color:var(--mu);
  background:rgba(255,253,248,.85);border:1px solid var(--line);padding:6px 11px;border-radius:999px;cursor:pointer}
.loc b{color:var(--ink);font-weight:600}
.loc .t{color:var(--red);letter-spacing:.02em}
.loc svg{color:#A29A8B}

/* 搜索 */
.search{display:flex;align-items:center;gap:9px;height:44px;margin-top:12px;padding:0 8px 0 14px;
  border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.search input{flex:1;font-size:12px;color:var(--ink);min-width:0}
.search input::placeholder{color:#AFA697}
.search .go{width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.search .go:active{transform:scale(.94)}

/* 分类圆点 */
.catrow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:9.5px;color:#6B6255;letter-spacing:.02em}
.cat i{width:46px;height:46px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;transition:.18s}
.cat i::after{content:"";position:absolute;inset:4px;border:1px dashed rgba(46,42,36,.11);border-radius:12px}
.cat svg{width:19px;height:19px;color:var(--green);position:relative;z-index:1}
.cat:active i{transform:translateY(2px)}
.cat:nth-child(2) svg{color:var(--red)}
.cat:nth-child(3) svg{color:#B8892F}
.cat:nth-child(4) svg{color:#5C7A8A}

/* 便签推荐 */
.note{position:relative;margin-top:18px;background:#FFF7E4;border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow)}
.note .tape{position:absolute;top:-9px;left:26px;width:66px;height:18px;background:rgba(240,194,78,.5);transform:rotate(-3deg);
  border-left:1px solid rgba(255,255,255,.55);border-right:1px solid rgba(255,255,255,.55)}
.note .nt{display:flex;align-items:baseline;justify-content:space-between}
.note h3{font-size:16px;font-weight:600;letter-spacing:.01em}
.note .nt span{font-size:9.5px;color:var(--red);letter-spacing:.06em}
.note p{font-size:10.5px;color:#7E7466;margin-top:6px;line-height:1.65}
.note .row{display:flex;align-items:center;gap:7px;margin-top:11px}
.note .mini{font-size:9px;letter-spacing:.04em;border:1px dashed rgba(46,42,36,.25);border-radius:6px;padding:4px 7px;color:#6B6255}
.note .cta{margin-left:auto;font-size:10px;font-weight:600;color:#FFF7E9;background:var(--red);border-radius:999px;padding:6px 12px}

/* 区块标题 */
.sechead{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 10px}
.sechead h2{font-size:16px;font-weight:600;font-family:var(--serif)}
.sechead h2 small{font-size:9px;color:var(--mu);margin-left:6px;letter-spacing:.08em;font-family:"PingFang SC",sans-serif;font-weight:400}
.sechead .more{font-size:10px;color:var(--mu)}

/* 商品卡 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;position:relative;cursor:pointer;transition:.16s}
.tile:active{transform:scale(.985)}
.tile-img{height:74px;border-radius:11px;background:#F3ECDD;position:relative;overflow:hidden;display:grid;place-items:center}
.tile-img span{width:26px;height:26px;background:var(--red);border-radius:7px;opacity:.88}
.tile.t2 .tile-img span{background:var(--green);border-radius:50%}
.tile.t3 .tile-img span{background:var(--butter);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
.tile.t4 .tile-img span{background:#6B8FA8;border-radius:3px;transform:rotate(18deg);width:22px}
.tile.t5 .tile-img span{background:#B8892F;border-radius:4px;width:30px;height:20px}
.tile.t6 .tile-img span{background:#8A6A4F;border-radius:50% 50% 6px 6px}
.tile-img u{position:absolute;right:7px;top:7px;font-size:8px;text-decoration:none;background:rgba(255,253,248,.92);
  border:1px solid var(--line);color:#7E7466;padding:2px 4px;border-radius:4px;letter-spacing:.02em}
.tile b{display:block;font-size:11.5px;font-weight:600;margin-top:7px;letter-spacing:.01em;line-height:1.35}
.tile small{display:block;font-size:8.5px;color:var(--mu);margin-top:3px}
.tile .pr{display:flex;align-items:baseline;gap:2px;margin-top:6px}
.tile .pr span{font-size:9px;color:var(--red)}
.tile .pr b{font-size:15px;margin:0;color:var(--red);font-weight:600}
.tile .add{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1px solid rgba(46,42,36,.2);
  display:grid;place-items:center;font-size:12px;color:#5F5749;background:var(--card)}
.tile .add:active{background:var(--red);color:#fff;border-color:var(--red)}

/* 通用卡片/行 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px dashed rgba(46,42,36,.16)}
.row:last-child{border-bottom:0}
.row .ic{width:34px;height:34px;border-radius:11px;background:#F3ECDD;display:grid;place-items:center;flex:0 0 auto;color:var(--green)}
.row .ic svg{width:17px;height:17px}
.row b{font-size:12px;font-weight:600;display:block}
.row small{font-size:9.5px;color:var(--mu);display:block;margin-top:3px}
.row .rt{margin-left:auto;font-size:10px;color:var(--mu);display:flex;align-items:center;gap:6px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border-radius:999px;
  background:var(--card);border:1px solid rgba(46,42,36,.2);font-size:11.5px;font-weight:600;letter-spacing:.02em;transition:.16s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:#FFF7E9}
.btn.red{background:var(--red);border-color:var(--red);color:#FFF7E9}
.btn.block{width:100%}
.btn.sm{height:30px;padding:0 12px;font-size:10.5px;border-radius:999px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45}

/* 步骤数量 */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.stepper button{width:26px;height:26px;display:grid;place-items:center;font-size:13px;color:#6B6255}
.stepper b{min-width:22px;text-align:center;font-size:11px;font-weight:600}

/* 底部导航 */
.tabbar{flex:0 0 auto;min-height:60px;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);position:relative;z-index:5}
.tabbar.three{grid-template-columns:repeat(3,1fr)}
.tabbar :is(a,button){display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mu);position:relative}
.tabbar .on{color:var(--green);font-weight:700;background:#E8EFE5}
.tabbar svg{width:20px;height:20px}
.tabbar .on::before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
.homebar{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:126px;height:4px;border-radius:2px;background:rgba(46,42,36,.32);z-index:8}

/* 顶部返回栏 */
.nav{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.nav .back{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.nav h1{font-size:16px;font-family:var(--serif);font-weight:600}
.nav .rt{margin-left:auto;font-size:10px;color:var(--mu)}

/* 空状态 */
.empty{text-align:center;padding:56px 20px;color:var(--mu)}
.empty i{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#F3ECDD;margin:0 auto 14px;color:#B3A68F}
.empty b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:10.5px;line-height:1.7}

/* 分隔标题 */
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.divider span{font-size:10px;color:var(--mu);letter-spacing:.1em}
.divider i{flex:1;height:1px;border-top:1px dashed rgba(46,42,36,.2)}

/* ---------- 商品详情 ---------- */
.pd{position:relative}
.pd-hero{height:238px;border-radius:0 0 26px 26px;background:#F3ECDD;position:relative;display:grid;place-items:center;margin:0 -22px}
.pd-hero .shape{width:92px;height:92px;background:var(--red);border-radius:24px;opacity:.9;transform:rotate(-6deg)}
.pd-hero .shape.g{background:var(--green);border-radius:50%}
.pd-hero .shape.y{background:var(--butter);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
.pd-hero .back{position:absolute;top:12px;left:18px;width:32px;height:32px;border-radius:50%;background:rgba(255,253,248,.9);border:1px solid var(--line);display:grid;place-items:center}
.pd-hero .tagpill{position:absolute;top:14px;right:18px;font-size:9px;background:rgba(255,253,248,.9);border:1px solid var(--line);padding:4px 8px;border-radius:999px;color:#7E7466}
.pd-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:-24px;position:relative;box-shadow:var(--shadow)}
.pd-card h2{font-size:19px;font-family:var(--serif);font-weight:600}
.pd-card .sub{font-size:10px;color:var(--mu);margin-top:6px}
.pd-price{display:flex;align-items:flex-end;gap:6px;margin-top:12px}
.pd-price b{font-size:26px;color:var(--red);font-weight:600;line-height:1}
.pd-price b i{font-size:12px;font-style:normal;margin-right:2px}
.pd-price small{font-size:9.5px;color:var(--mu);text-decoration:line-through}
.pd-price .save{margin-left:auto;font-size:9px;color:var(--red);border:1px solid rgba(217,96,58,.4);padding:3px 6px;border-radius:6px}
.specs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.specs button{font-size:10.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:#6B6255}
.specs button.on{border-color:var(--green);color:var(--green);background:rgba(53,102,79,.07);font-weight:600}
.pd-block{margin-top:12px}
.pd-block .bh{display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px}
.pd-block .bh b{font-weight:600}
.pd-block .bh span{color:var(--mu);font-size:10px}
.pd-desc{font-size:10.5px;line-height:1.8;color:#6B6255}
.review{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed rgba(46,42,36,.16);font-size:10.5px}
.review:last-child{border:0}
.review .av{width:24px;height:24px;border-radius:50%;background:#EADFCB;display:grid;place-items:center;font-size:9px;color:#7E7466;flex:0 0 auto}
.review b{font-weight:600;font-size:10.5px}
.review p{color:#6B6255;margin-top:3px;line-height:1.6}
.pd-bar{flex:0 0 auto;display:flex;gap:9px;align-items:center;padding:10px 18px 18px;border-top:1px dashed rgba(46,42,36,.16);background:var(--paper)}
.pd-bar .stepper{height:38px;border-radius:999px}
.pd-bar .stepper button{width:32px;height:36px}
.pd-bar .btn{flex:1;height:44px}

/* ---------- 购物车 ---------- */
.cart-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed rgba(46,42,36,.16)}
.check{width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(46,42,36,.3);display:grid;place-items:center;flex:0 0 auto}
.check.on{background:var(--green);border-color:var(--green)}
.check.on::after{content:"";width:4px;height:7px;border:solid #FFF7E9;border-width:0 1.6px 1.6px 0;transform:rotate(42deg) translateY(-1px)}
.cart-thumb{width:52px;height:52px;border-radius:12px;background:#F3ECDD;display:grid;place-items:center;flex:0 0 auto}
.cart-thumb span{width:20px;height:20px;background:var(--red);border-radius:6px;opacity:.85}
.cart-info{flex:1;min-width:0}
.cart-info b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-info small{display:block;font-size:9px;color:var(--mu);margin-top:3px}
.cart-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cart-right .p{font-size:13px;color:var(--red);font-weight:600}
.cart-bar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;margin:14px -22px -18px;padding:12px 22px 16px;
  background:linear-gradient(180deg,rgba(251,245,234,0),var(--paper) 32%);}
.cart-bar .sum{font-size:10px;color:var(--mu);line-height:1.5}
.cart-bar .sum b{display:block;color:var(--ink);font-size:15px}
.cart-bar .btn{margin-left:auto;height:44px;padding:0 22px}

/* ---------- 结算 ---------- */
.co-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}
.co-addr{display:flex;align-items:center;gap:10px;cursor:pointer}
.co-addr .pin{width:32px;height:32px;border-radius:50%;background:rgba(217,96,58,.1);display:grid;place-items:center;color:var(--red);flex:0 0 auto}
.co-addr b{font-size:12.5px;font-weight:600;display:block}
.co-addr small{font-size:9.5px;color:var(--mu);display:block;margin-top:3px}
.co-addr .arrow{margin-left:auto;color:#B3A68F}
.co-h{font-size:10px;letter-spacing:.1em;color:var(--mu);margin-bottom:10px}
.co-line{display:flex;justify-content:space-between;font-size:11px;padding:7px 0;color:#4F483D}
.co-line b{font-weight:600}
.co-line.total b{color:var(--red);font-size:15px}
.pay-opt{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:11.5px}
.pay-opt .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(46,42,36,.3);flex:0 0 auto;display:grid;place-items:center}
.pay-opt.on .radio{border-color:var(--green)}
.pay-opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.pay-opt .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#F3ECDD;color:var(--green)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:10.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:#6B6255}
.chip.on{border-color:var(--green);background:rgba(53,102,79,.08);color:var(--green);font-weight:600}
.note-input{width:100%;font-size:11px;color:var(--ink);min-height:38px;resize:none;line-height:1.6}
.note-input::placeholder{color:#B3A68F}

/* 下单成功 */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;text-align:center}
.done .stamp{width:96px;height:96px;border-radius:50%;border:2px dashed rgba(53,102,79,.5);display:grid;place-items:center;color:var(--green);transform:rotate(-6deg);margin-bottom:20px}
.done h2{font-family:var(--serif);font-size:24px;font-weight:600}
.done p{font-size:11px;color:var(--mu);line-height:1.8;margin-top:9px}
.done .acts{display:flex;gap:10px;margin-top:24px}

/* ---------- 订单 ---------- */
.seg{display:flex;gap:20px;margin:2px 0 12px;border-bottom:1px solid rgba(46,42,36,.1)}
.seg button{font-size:12px;color:#9C9284;padding:0 0 9px;position:relative}
.seg button.on{color:var(--ink);font-weight:600}
.seg button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red);border-radius:2px}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.ord-h{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--mu)}
.ord-h .no{letter-spacing:.04em}
.ord-h .st{margin-left:auto;font-size:9.5px;padding:3px 7px;border-radius:999px}
.st.wait{background:rgba(184,137,47,.14);color:#8A6A2F}
.st.run{background:rgba(53,102,79,.12);color:var(--green)}
.st.done{background:rgba(46,42,36,.07);color:#7E7466}
.st.cancel{background:rgba(46,42,36,.06);color:#A29A8B}
.ord-items{display:flex;align-items:center;gap:8px;margin-top:10px}
.ord-items .thumbs{display:flex}
.ord-items .thumbs span{width:40px;height:40px;border-radius:10px;background:#F3ECDD;display:grid;place-items:center;margin-right:-8px;border:2px solid var(--card)}
.ord-items .thumbs span i{width:14px;height:14px;background:var(--red);border-radius:4px;opacity:.8}
.ord-items .meta{margin-left:18px;font-size:10px;color:var(--mu)}
.ord-items .total{margin-left:auto;text-align:right}
.ord-items .total b{display:block;font-size:14px;font-weight:600}
.ord-items .total small{font-size:9px;color:var(--mu)}
.ord-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:11px;padding-top:10px;border-top:1px dashed rgba(46,42,36,.16)}

/* 时间轴 */
.timeline{padding:4px 0 2px}
.tl{display:flex;gap:11px;position:relative;padding-bottom:18px}
.tl:last-child{padding-bottom:2px}
.tl .dot{width:9px;height:9px;border-radius:50%;border:2px solid #CFC4AE;background:var(--card);flex:0 0 auto;margin-top:3px;z-index:1}
.tl.on .dot{border-color:var(--green);background:var(--green)}
.tl.now .dot{border-color:var(--red);background:var(--red);box-shadow:0 0 0 4px rgba(217,96,58,.12)}
.tl .ln{position:absolute;left:4px;top:14px;bottom:0;border-left:1px dashed rgba(46,42,36,.22)}
.tl:last-child .ln{display:none}
.tl b{font-size:11.5px;font-weight:600;display:block}
.tl small{font-size:9.5px;color:var(--mu);display:block;margin-top:3px;line-height:1.6}

/* ---------- 我的 ---------- */
.me-head{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
.me-head .av{width:54px;height:54px;border-radius:50%;background:var(--green);color:#FFF7E9;display:grid;place-items:center;font-size:19px;font-family:var(--serif)}
.me-head b{font-size:17px;font-family:var(--serif);font-weight:600;display:block}
.me-head small{font-size:10px;color:var(--mu);display:block;margin-top:4px}
.me-stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.me-stats div{padding:12px 0;text-align:center;border-right:1px solid var(--line)}
.me-stats div:last-child{border:0}
.me-stats b{display:block;font-size:17px;font-weight:600}
.me-stats span{display:block;font-size:9px;color:var(--mu);margin-top:3px}

/* ---------- 配送端 ---------- */
.d-top{display:flex;align-items:center;justify-content:space-between;padding:2px 0 12px}
.d-top .who{font-size:10.5px;color:var(--mu)}
.d-top .who b{display:block;font-size:16px;color:var(--ink);margin-top:3px;font-family:var(--serif);font-weight:600}
.d-switch{display:flex;align-items:center;gap:7px;font-size:10px;border-radius:999px;padding:7px 11px;border:1px solid rgba(53,102,79,.3);color:var(--green);background:rgba(53,102,79,.07)}
.d-switch.off{border-color:rgba(46,42,36,.16);color:#8B8175;background:rgba(46,42,36,.04)}
.d-switch i{width:6px;height:6px;border-radius:50%;background:currentColor}
.d-brief{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.d-brief div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px}
.d-brief span{font-size:8.5px;color:var(--mu);letter-spacing:.04em}
.d-brief b{display:block;font-size:17px;margin-top:5px;font-weight:600}
.d-brief b i{font-size:9px;color:var(--mu);font-style:normal;margin-right:1px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.ticket::before,.ticket::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1px solid var(--line);top:92px}
.ticket::before{left:-8px}
.ticket::after{right:-8px}
.tk-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0}
.tk-top .id{font-size:10px;color:var(--mu);letter-spacing:.04em}
.tk-title{padding:8px 14px 0}
.tk-title h3{font-size:19px;font-family:var(--serif);font-weight:600}
.tk-title p{font-size:10px;color:var(--mu);margin-top:5px}
.tk-dash{height:1px;margin:12px 14px;border-top:1px dashed rgba(46,42,36,.24)}
.tk-route{padding:0 14px}
.tk-foot{display:flex;align-items:center;gap:10px;padding:12px 14px 14px}
.tk-foot .sum{font-size:9px;color:var(--mu);line-height:1.5}
.tk-foot .sum b{display:block;color:var(--ink);font-size:11px}
.tk-foot .btn{margin-left:auto;height:40px;padding:0 16px}
.ticket.paper{transform:rotate(-.5deg)}
.stamp{transform:rotate(-6deg);border:1.5px solid var(--red);color:var(--red);font-size:9px;letter-spacing:.14em;padding:3px 6px;border-radius:4px;font-weight:600}
.d-steps{display:flex;margin:2px 0 14px}
.d-step{flex:1;text-align:center;position:relative;font-size:9px;color:#B3A68F}
.d-step i{display:block;height:3px;border-radius:2px;background:#E7DFCE;margin:0 3px 8px}
.d-step.on{color:var(--green);font-weight:600}
.d-step.on i{background:var(--green)}
.d-step.now{color:var(--red);font-weight:600}
.d-step.now i{background:var(--red)}
.avail{display:flex;align-items:center;gap:9px;background:rgba(255,253,248,.72);border:1px dashed rgba(46,42,36,.2);border-radius:12px;padding:10px 11px;margin-bottom:8px}
.avail b{font-size:11px;font-weight:600}
.avail small{display:block;font-size:9px;color:var(--mu);margin-top:3px}
.avail .fee{margin-left:auto;text-align:right}
.avail .fee b{color:var(--green);font-size:12px}
.avail .fee span{display:block;font-size:8.5px;color:var(--mu);margin-top:2px}

/* ---------- 管理端 ---------- */
.a-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.a-kpi{border-radius:16px;padding:11px 12px;border:1px solid var(--line);background:var(--card)}
.a-kpi:nth-child(1){background:#FFF3D6;transform:rotate(-.8deg)}
.a-kpi:nth-child(2){background:#EAF1E7;transform:rotate(.7deg)}
.a-kpi:nth-child(4){background:#FBEDE5;transform:rotate(-.4deg)}
.a-kpi span{font-size:8.5px;color:#7E7466;letter-spacing:.06em;display:flex;justify-content:space-between}
.a-kpi span i{font-style:normal;color:var(--green);font-weight:600}
.a-kpi b{display:block;font-size:21px;margin-top:8px;font-weight:600;letter-spacing:-.01em}
.a-kpi b i{font-style:normal;font-size:10px;color:#7E7466;margin-right:2px}
.a-kpi em{font-style:normal;font-size:8.5px;color:#8B8175;display:block;margin-top:5px}
.abar-c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:12px}
.abar-c .ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.abar-c .ch b{font-size:11px;font-weight:600}
.abar-c .ch span{font-size:8.5px;color:var(--mu)}
.abars{display:flex;align-items:flex-end;gap:8px;height:72px;border-bottom:1px dashed rgba(46,42,36,.22)}
.abars i{flex:1;background:#E7DFCE;border-radius:6px 6px 0 0;position:relative;transition:height .35s ease}
.abars i.on{background:var(--red)}
.abars i.on::after{content:attr(data-v);position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--red)}
.ax{display:flex;gap:8px;margin-top:6px}
.ax span{flex:1;text-align:center;font-size:8px;color:#A29888}
.a-feed .f{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed rgba(46,42,36,.16);font-size:10px;color:#4F483D}
.a-feed .f:last-child{border:0}
.a-feed .f time{color:#A29888;font-size:8.5px;flex:0 0 28px;padding-top:1px}
.a-feed .f i{width:5px;height:5px;border-radius:50%;background:#CFC4AE;margin-top:5px;flex:0 0 auto}
.a-feed .f i.on{background:var(--green)}
.a-feed .f i.hot{background:var(--red)}
.a-todo{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed rgba(46,42,36,.16);font-size:10.5px;color:#4F483D;cursor:pointer}
.a-todo:last-child{border:0}
.a-todo.cked{color:#A29A8B;text-decoration:line-through}
.a-todo .ck{width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(46,42,36,.28);flex:0 0 auto;display:grid;place-items:center}
.a-todo.cked .ck{background:var(--green);border-color:var(--green)}
.a-todo.cked .ck::after{content:"";width:3px;height:6px;border:solid #FFF7E9;border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
.a-todo > span:last-child{margin-left:auto;font-size:8.5px;color:#A29888}
.a-order{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(46,42,36,.16);font-size:10.5px;cursor:pointer}
.a-order:last-child{border:0}
.a-order .no{font-size:9.5px;color:var(--mu);flex:0 0 46px}
.a-order b{font-weight:600}
.a-order .pill{font-size:8px;padding:2px 6px;border-radius:999px}
.a-order .amt{margin-left:auto;font-weight:600}
.goods-row{padding:10px 0;border-bottom:1px dashed rgba(46,42,36,.16)}
.goods-row:last-child{border:0}
.goods-top{display:flex;align-items:center;gap:9px}
.goods-top b{font-size:11.5px;font-weight:600}
.goods-top small{display:block;font-size:9px;color:var(--mu);margin-top:3px}
.goods-top .qty{margin-left:auto;font-size:11px;font-weight:600}
.stockbar{height:5px;border-radius:3px;background:#EFE7D6;margin-top:8px;overflow:hidden}
.stockbar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.stockbar.low i{background:var(--red)}
.rider{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed rgba(46,42,36,.16)}
.rider:last-child{border:0}
.rider .rv{width:34px;height:34px;border-radius:50%;background:#EADFCB;display:grid;place-items:center;font-size:11px;color:#7E7466;flex:0 0 auto}
.rider b{font-size:11.5px;font-weight:600}
.rider small{display:block;font-size:9px;color:var(--mu);margin-top:3px}
.tg{width:38px;height:22px;border-radius:999px;background:#DCD3C1;position:relative;transition:.2s;flex:0 0 auto}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--green)}
.tg.on::after{left:18px}
.ml-auto{margin-left:auto}

/* ---------- 补充：购物袋 / 可点区域 ---------- */
.bag{position:relative;width:38px;height:38px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow)}
.bag:active{transform:translateY(1px)}
.badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#FFF7E9;
  font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--paper)}
.note .cta,.sechead .more,.loc,.a-order,.a-todo,.rider,.tile,.ord,.cat{cursor:pointer}
.pd-hero .shape{z-index:0}


.cart-foot{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 22px 20px;border-top:1px dashed rgba(46,42,36,.16);background:var(--paper)}
.cart-foot .sum{margin-left:auto;font-size:10px;color:var(--mu);line-height:1.4;text-align:right}
.cart-foot .sum b{display:block;color:var(--ink);font-size:16px}
.cart-foot .btn{height:44px;padding:0 20px}


.sheet-x{position:absolute;top:10px;right:14px;width:28px;height:28px;border-radius:50%;background:rgba(46,42,36,.06);
  color:#7E7466;font-size:17px;line-height:1;display:grid;place-items:center}
.sheet-x:active{background:rgba(46,42,36,.12)}


/* 订单日志时间轴 */
.logs{padding:2px 0 0}
.log{display:grid;grid-template-columns:38px 10px 1fr;gap:9px;position:relative;padding-bottom:14px}
.log time{font-size:9px;color:var(--mu);padding-top:2px;font-variant-numeric:tabular-nums}
.log .dot{width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--green);margin-top:2px;z-index:1}
.log:last-child .dot{border-color:var(--red);background:var(--red);box-shadow:0 0 0 4px rgba(217,96,58,.12)}
.log .ln{position:absolute;left:51px;top:13px;bottom:0;border-left:1px dashed rgba(46,42,36,.22)}
.log:last-child .ln{display:none}
.log b{font-size:11px;font-weight:600;display:block}
.log small{font-size:9.5px;color:var(--mu);display:block;margin-top:2px;line-height:1.55}

/* 表单 */
.field{margin-bottom:11px}
.field > label{display:block;font-size:9.5px;color:var(--mu);letter-spacing:.08em;margin-bottom:6px}
.inp{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:12px;color:var(--ink);display:block}
.inp::placeholder{color:#B3A68F}
textarea.inp{height:62px;padding:9px 12px;line-height:1.6;resize:none}
.field-row{display:flex;gap:9px}
.field-row .field{flex:1;min-width:0}
.hint{font-size:9px;color:#A29888;margin-top:5px}
.field .chips{gap:6px;margin-bottom:0}
.field .chip{padding:6px 10px;font-size:10px}

/* 库存步进 */
.stock-step{display:flex;align-items:center;margin-left:8px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;flex:0 0 auto}
.stock-step button{width:26px;height:26px;font-size:13px;color:#6B6255;display:grid;place-items:center}
.stock-step button:active{background:rgba(46,42,36,.06)}
.stock-step b{min-width:32px;text-align:center;font-size:11px;font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:26px}
.goods-row.off{opacity:.5}
.goods-row .goods-top{gap:9px}
.goods-row .btn.sm{padding:0 10px;height:28px}

/* 支付说明 */
.pay-opt .pt b{display:block;font-size:11.5px;font-weight:600}
.pay-opt .pt small{display:block;font-size:9px;color:var(--mu);margin-top:1px}


/* 促销 */
.promo-row{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.promo-row::-webkit-scrollbar{display:none}
.pcard2{flex:0 0 146px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;position:relative;text-align:left}
.pimg2{height:66px;border-radius:11px;background:#F3ECDD;display:grid;place-items:center;position:relative;overflow:hidden}
.pimg2 span{width:22px;height:22px;background:var(--red);border-radius:6px;opacity:.85}
.pimg2.t2 span{background:var(--green);border-radius:50%}
.pimg2.t3 span{background:var(--butter);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
.pimg2.t4 span{background:#6B8FA8;border-radius:3px;transform:rotate(18deg);width:20px}
.pimg2.t5 span{background:#B8892F;border-radius:4px;width:26px;height:18px}
.pimg2.t6 span{background:#8A6A4F;border-radius:50% 50% 6px 6px}
.pimg2 u{position:absolute;left:6px;top:6px;text-decoration:none;font-size:11px;background:var(--red-action);color:#FFF7E9;padding:2px 5px;border-radius:4px}
.pcard2 > b{display:block;font-size:12px;font-weight:600;margin-top:7px;line-height:1.4;min-height:34px;overflow-wrap:anywhere}
.pcard2 .pp{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.pcard2 .pp b{color:var(--red-action);font-size:14px;font-weight:700}
.pcard2 .pp s{font-size:11px;color:var(--mu)}
.promo-band{margin-top:10px;font-size:9.5px;color:var(--red);background:rgba(217,96,58,.08);border:1px dashed rgba(217,96,58,.35);border-radius:8px;padding:6px 9px;letter-spacing:.02em}
.sale-tag{font-style:normal;font-size:8px;background:var(--red);color:#FFF7E9;border-radius:3px;padding:1px 3px;margin-left:3px;vertical-align:1px}

/* 配送端消息 */
.bell{position:relative;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:#6B6255}
.bell svg{width:16px;height:16px}
.bell-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#FFF7E9;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px;border:1.5px solid var(--paper)}
.refresh{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--mu);letter-spacing:.02em}
.refresh svg{width:12px;height:12px}
.refresh span{color:#B3A68F;font-variant-numeric:tabular-nums}
.msg{display:flex;gap:9px;padding:10px 0;border-bottom:1px dashed rgba(46,42,36,.16);align-items:flex-start}
.msg:last-of-type{border:0}
.msg .mdot{width:7px;height:7px;border-radius:50%;background:#CFC4AE;margin-top:6px;flex:0 0 auto}
.msg.unread .mdot{background:var(--red)}
.msg b{display:block;font-size:11px;font-weight:600;line-height:1.5}
.msg small{display:block;font-size:9px;color:var(--mu);margin-top:3px}
.msg:not(.unread) b{color:#8B8175;font-weight:500}

/* 管理端促销标 */
.tag-sale{font-size:8px;background:rgba(217,96,58,.12);color:var(--red);border-radius:3px;padding:1px 4px;margin-left:5px;font-weight:600;vertical-align:1px}


/* 促销详情 */
.promo-wrap{margin-top:12px}
.promo-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(135deg,#D9603A,#C24E2B);color:#FFF7E9;border-radius:12px;padding:10px 12px}
.promo-banner .pb-l b{display:block;font-size:12.5px;letter-spacing:.02em}
.promo-banner .pb-l em{display:block;font-style:normal;font-size:9.5px;opacity:.92;margin-top:3px}
.promo-banner .pb-r{text-align:right;flex:0 0 auto}
.promo-banner .pb-r small{display:block;font-size:8px;letter-spacing:.14em;opacity:.85}
.promo-banner .pb-r b{display:block;font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-top:2px}
.tier-table{margin-top:8px;border:1px dashed rgba(217,96,58,.35);border-radius:10px;overflow:hidden}
.tier-row{display:flex;justify-content:space-between;font-size:10px;color:#7E7466;padding:6px 11px;border-bottom:1px dashed rgba(217,96,58,.22)}
.tier-row:last-child{border:0}
.tier-row b{color:var(--red);font-weight:600}
.tier-row.on{background:rgba(217,96,58,.07)}
.tier-row.on span{color:var(--ink);font-weight:600}

/* 管理端折扣阶梯编辑 */
.te-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:10px;color:#7E7466}
.te-row .te-fix{font-size:10px;color:#7E7466}
.te-inp{height:34px;width:64px;flex:0 0 64px;text-align:center;padding:0 6px;font-size:12px}

function photoPreview(d) {

function readProductPhoto(input) {
  var file = input.files[0];
  if (!file) return;
  input.value = '';
  var draft = state.pdraft;
  var request = (draft.photoRequest || 0) + 1;
  draft.photoRequest = request;
  draft.photoPending = true;
  draft.photoError = '';
  paint('photo-preview', photoPreview(draft));
  function finish(message, source) {
    if (draft !== state.pdraft || request !== draft.photoRequest) return;
    draft.photoPending = false;
    draft.photoError = message;
    if (source) draft.image = source;
    paint('photo-preview', photoPreview(draft));
  }
  if (!['image/jpeg', 'image/png'].includes(file.type) || file.size > 5 * 1024 * 1024) {
    finish('请选择 5 MB 以内的 JPEG 或 PNG 照片'); return;
  }
  var reader = new FileReader();
  reader.onload = function () {
    var image = new Image();
    image.onload = function () {
      if (image.naturalWidth > 4096 || image.naturalHeight > 4096) finish('照片长宽均须在 4096 像素以内');
      else finish('', reader.result);
    };
    image.onerror = function () { finish('无法读取照片，请换一张 JPEG 或 PNG'); };
    image.src = reader.result;
  };
  reader.onerror = function () { finish('无法读取照片，请重新选择'); };
  reader.readAsDataURL(file);
}

  var address = state.me.addrs[Number(value)];
  if (!address) return;
  openSheet('<h3>删除收货地址？</h3><p class="sub">' + esc(address.name) + '</p>' +
    '<div class="address-actions"><button class="btn ghost" data-act="addrSheet">取消</button>' +
    '<button class="btn red" data-act="addrDeleteConfirm" data-val="' + Number(value) + '">确认删除</button></div>');
};
ACTIONS.addrDeleteConfirm = function (value) {
  var index = Number(value);
  if (!state.me.addrs[index]) return;
  state.me.addrs.splice(index, 1);
  var selected = state.checkout.addrIndex;
  state.checkout.addrIndex = selected === index ? Math.max(0, Math.min(index, state.me.addrs.length - 1))
    : selected > index ? selected - 1 : selected;
  render();
  ACTIONS.addrSheet();
  toast('收货地址已删除');
};
ACTIONS.addrPick = function (v) {
  var p = v.split('|');
  state.addrDraft[p[0]] = p[1];
  openSheet(addrForm());
};
ACTIONS.addrSave = function () {
  var d = state.addrDraft;
  var contact = String(d.contact || '').trim() || '小满';
  var phone = String(d.phone || '').trim();
  if (phone && !/^(?:1\d{10}|\+[1-9]\d{6,14})$/.test(phone)) { toast('请输入有效的联系电话'); return; }
  var sub = contact + (phone ? ' · ' + maskPhone(phone) : '');
  if (d.index != null) {
    var address = state.me.addrs[d.index];
    var editedName = d.name.trim();
    if (!address || !editedName) { toast('请填写楼栋和房间'); return; }
    Object.assign(address, { name: editedName, sub: sub, contact: contact, phone: phone });
    closeSheet();
    render();
    toast('收货地址已保存');
    return;
  }
  var room = String(d.room || '').replace(/\D/g, '');
  if (!d.building) { toast('先选楼栋'); return; }
  if (!d.floor) { toast('先选楼层'); return; }
  if (room.length < 2) { toast('宿舍号填两位，如 08'); return; }
  var name = d.building + ' ' + d.floor + room;
  state.me.addrs.push({ name: name, sub: sub, tag: '宿舍', contact: contact, phone: phone });
  state.checkout.addrIndex = state.me.addrs.length - 1;
  closeSheet();
  render();
  toast('已新增地址：' + name);
};
ACTIONS.aRider = function (i) {
  var r = state.admin.riders[Number(i)];
  r.online = !r.online;
  render();
  toast(r.name + (r.online ? ' 已上线' : ' 已下线'));
};

/* 搜索等输入 */
var INPUTS = {};
INPUTS.search = function (v) {
  state.search = v;
  var list = filtered(v, '全部');
  paint('goodsGrid', list.length ? tiles(list) : '');
  paint('secTitle', (v.trim() ? '搜索「' + esc(v.trim()) + '」' : '常买清单') + '<small>共 ' + list.length + ' 件</small>');
  var empty = document.getElementById('homeEmpty');
  if (empty) empty.hidden = !!list.length;
  var promos = document.getElementById('homePromos');
  if (promos) promos.hidden = !!v.trim();
};
INPUTS.note = function (v) { state.checkout.note = v; };
INPUTS.dorder = function (v) {
  state.deliver.q = v;
  if (window.DLIST) { var r = window.DLIST(); paint('dOrderList', r.html); paint('dOrderCount', r.count + ' 单'); }
};
INPUTS.asearch = function (v) {
  state.admin.q = v;
  state.admin.orderSelection = [];
  if (window.ALIST) { var r = window.ALIST(); paint('aOrderList', r.html); paint('aOrderCount', r.count + ' 单'); paint('aBatchControls', r.controls); }
};
INPUTS.riderPayFilter = function (v) {
  state.deliver.payFilter = v;
  state.deliver.claimSelection = [];
  state.deliver.deliverySelection = [];
  renderAtScroll();
};
INPUTS.pf = function (v, el) { state.pdraft[el.dataset.field] = v; };
INPUTS.promo = function (v, el) {
  var d = state.admin.promoDraft;
  var f = el.dataset.field;
  if (f === 'start' || f === 'end') { d[f] = v; return; }
  var m = f.match(/^tier-(\d+)-(min|z)$/);
  if (m) d.tiers[Number(m[1])][m[2]] = v;
};
INPUTS.addr = function (v, el) {
  var f = el.dataset.field;
  if (f === 'room') {
    var digits = v.replace(/\D/g, '').slice(0, 2);
    state.addrDraft.room = digits;
    el.value = digits;
  } else {
    state.addrDraft[f] = v;
  }
  var prev = document.getElementById('addrPreview');
  if (prev) prev.textContent = '将生成：' + state.addrDraft.building + ' ' + state.addrDraft.floor + (state.addrDraft.room || '__');
};

/* 事件 */
document.addEventListener('click', function (e) {
  var sw = e.target.closest('[data-client]');
  if (sw) { switchClient(sw.dataset.client); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  e.stopPropagation();
  fn(el.dataset.val, el);
});
document.addEventListener('input', function (e) {
  var el = e.target.closest('[data-input]');
  if (!el) return;
  var fn = INPUTS[el.dataset.input];
  if (fn) fn(el.value, el);
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'product-photo') readProductPhoto(e.target);
});
$('#veil').addEventListener('click', closeSheet);

var initial = (location.hash || '').replace('#', '');
if (['user', 'delivery', 'admin'].indexOf(initial) >= 0) state.client = initial;
window.addEventListener('hashchange', function () {
  var h = (location.hash || '').replace('#', '');
  if (['user', 'delivery', 'admin'].indexOf(h) >= 0 && h !== state.client) switchClient(h);
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) stopRiderVoice();
  else notifyNewUrges();
});

/* 配送端大厅：10 秒静默刷新 */
setInterval(function () {
  if (state.client !== 'delivery' || state.route.delivery !== 'hall') return;
  var left = 10 - Math.floor((Date.now() - state.deliver.last) / 1000);
  var el = document.getElementById('refreshHint');
  if (el) el.textContent = left > 0 ? left + 's' : '刷新中';
  if (left <= 0) ACTIONS.refreshTasks(true);
}, 1000);

/* 促销倒计时 */
setInterval(function () {
  var els = document.querySelectorAll('[data-end]');
  for (var i = 0; i < els.length; i++) {
    var end = new Date(els[i].getAttribute('data-end')).getTime();
    var left = end - Date.now();
    if (left <= 0) { els[i].textContent = '已结束'; continue; }
    var dd = Math.floor(left / 86400000);
    var hh = Math.floor(left % 86400000 / 3600000);
    var mm = Math.floor(left % 3600000 / 60000);
    var ss = Math.floor(left % 60000 / 1000);
    els[i].textContent = (dd > 0 ? dd + '天 ' : '') + pad2(hh) + ':' + pad2(mm) + ':' + pad2(ss);
  }
}, 1000);
</script>
<script>
/* 用户端 */
(function () {
  function uTab(active) {
    var items = [
      ['home', '首页', '<path d="M4 10.5L12 4l8 6.5V20H4z"/><path d="M9.6 20v-5.4h4.8V20"/>'],
      ['category', '分类', '<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>'],
      ['orders', '订单', '<path d="M6 3h12v18l-6-4-6 4z"/>'],
      ['me', '我的', '<circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c1-3.6 3.9-5.6 7.2-5.6s6.2 2 7.2 5.6"/>']
    ];
    return '<nav class="tabbar">' + items.map(function (it) {
      var on = active === it[0];
      return '<button class="' + (on ? 'on' : '') + '"' + (on ? ' aria-current="page"' : '') + ' data-act="tab" data-val="' + it[0] + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">' + it[2] + '</svg>' + it[1] + '</button>';
    }).join('') + '</nav>' + homebar();
  }

  function nav(title, rt) {
    return '<div class="nav"><button class="back" data-act="back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>' +
      '<h1>' + title + '</h1><span class="rt">' + (rt || '') + '</span></div>';
  }

  function bagBtn() {
    return '<button class="bag" data-act="tab" data-val="cart" aria-label="购物袋">' +
      '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h16l-1.2 12H5.2L4 8z"/><path d="M8.5 8V6.2a3.5 3.5 0 0 1 7 0V8"/></svg>' +
      '<span class="badge" id="bagBadge" style="display:' + (cartCount() ? 'grid' : 'none') + '">' + cartCount() + '</span></button>';
  }

  function catIcon(i) {
    var paths = [
      '<path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
      '<path d="M8 4h8l2 9a5 5 0 0 1-12 0z"/><path d="M7 20h10"/>',
      '<circle cx="12" cy="12" r="7"/><path d="M9 12h6"/>',
      '<rect x="5" y="4" width="14" height="16" rx="1.5"/><path d="M9 8h6M9 12h6"/>',
      '<path d="M12 4v16M4 12h16"/>'
    ];
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">' + paths[i] + '</svg>';
  }

  function timeline(o) {
    var steps = [
      ['已下单', o.created || '今天 20:04', true],
      ['备货完成', '北苑仓 A-12', false],
      ['骑手取货', o.rider && o.rider !== '待分配' ? o.rider + ' 已接单' : '等待分配骑手', false],
      ['送达', o.status === '已完成' ? '已送达，感谢下单' : (o.status === '配送中' ? '预计 20:31 送达' : '预计 30 分钟内'), false]
    ];
    var idx = o.status === '备货中' ? 1 : o.status === '待取货' ? 2 : o.status === '配送中' ? 2 : 3;
    if (o.status === '已完成') idx = 4;
    if (o.status === '已取消' || o.status === '已退款') {
      return '<div class="timeline"><div class="tl now"><span class="dot"></span><div><b>' + o.status + '</b><small>退款已原路退回，预计 1 分钟内到账</small></div></div></div>';
    }
    return '<div class="timeline">' + steps.map(function (s, i) {
      var cls = i < idx ? 'on' : (i === idx ? 'now' : '');
      return '<div class="tl ' + cls + '"><span class="dot"></span><span class="ln"></span><div><b>' + s[0] + '</b><small>' + s[1] + '</small></div></div>';
    }).join('') + '</div>';
  }

  VIEWS.user.home = function () {
    var list = filtered(state.search, '全部');
    var cats = ['全部', '冰饮', '零食', '文具', '日用'];
    var pick = byId('p3');
    var address = state.me.addrs[state.checkout.addrIndex];
    var promos = promoList().filter(function (p) { return p.stock > 0 && promoBestTier(p); });
    return statusbar() +
      '<div class="scroll">' +
        '<div class="hello"><div><div class="k">校零智选 · 北苑校园店</div><h1>宿舍采购清单</h1></div>' + bagBtn() + '</div>' +
        '<button class="loc" data-act="addrSheet">' +
          '<svg width="11" height="13" viewBox="0 0 12 15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 1.5c2.6 0 4.6 2 4.6 4.5 0 3.2-4.6 7.5-4.6 7.5S1.4 9.2 1.4 6C1.4 3.5 3.4 1.5 6 1.5z"/><circle cx="6" cy="6" r="1.5"/></svg>' +
          (address ? '配送至 <b>' + esc(address.name) + '</b><span class="t">约 30 分钟</span>' : '<b>添加收货地址</b>') +
          '<svg width="9" height="6" viewBox="0 0 9 6" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1l3.5 3.4L8 1"/></svg>' +
        '</button>' +
        '<div class="search">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>' +
          '<input type="search" data-input="search" aria-label="搜索商品" value="' + esc(state.search) + '" placeholder="搜零食、冰饮、文具">' +
        '</div>' +
        '<div class="catrow">' + cats.map(function (c, i) {
          return '<button class="cat" data-act="openCat" data-val="' + c + '"><i>' + catIcon(i) + '</i>' + c + '</button>';
        }).join('') + '</div>' +
        (pick && pick.shelf && pick.stock > 0 ? '<div class="note home-note"><span class="tape"></span>' +
          '<div class="nt"><h3 class="h-serif">今晚的推荐</h3><span>20:00–23:00</span></div>' +
          '<div class="note-buy"><p>' + esc(pick.name) + ' <strong>' + money(unitPrice(pick, 1)) + '</strong></p>' +
          '<button class="cta" data-act="openP" data-val="' + pick.id + '">查看商品</button></div>' +
        '</div>' : '') +
        '<div class="sechead"><h2 id="secTitle">' + (state.search.trim() ? '搜索「' + esc(state.search.trim()) + '」' : '常买清单') + '<small>共 ' + list.length + ' 件</small></h2>' +
          '<button class="more" data-act="openCat" data-val="全部">全部 →</button></div>' +
        '<div class="grid" id="goodsGrid">' + (list.length ? tiles(list) : '') + '</div>' +
        '<div id="homeEmpty"' + (list.length ? ' hidden' : '') + '>' + emptyState('没有找到相关商品', '换个关键词试试，比如「薯片」「冰饮」') + '</div>' +
        (promos.length ? '<section id="homePromos"' + (state.search.trim() ? ' hidden' : '') + '>' +
          '<div class="sechead"><h2>限时促销 <small>' + promos.length + ' 件</small></h2></div>' +
          '<div class="promo-row">' + promos.map(function (p) {
            return '<button class="pcard2" data-act="openP" data-val="' + p.id + '">' +
              '<span class="pimg2 ' + p.tone + '">' + productPhoto(p.image, p.name, '<span></span>') + '<u>低至 ' + offLabel(promoBestTier(p).off) + '</u></span>' +
              '<b>' + esc(p.name) + '</b><span class="pp"><b>' + money(promoLowPrice(p)) + '</b><s>' + money(p.price) + '</s></span></button>';
          }).join('') + '</div></section>' : '') +
        '<div style="height:16px"></div>' +
      '</div>' + uTab('home');
  };

  VIEWS.user.category = function () {
    var list = filtered('', state.cat);
    return statusbar() +
      '<div class="nav"><button class="back" data-act="back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>' +
        '<h1>分类</h1><span class="rt">' + list.length + ' 件</span></div>' +
      '<div class="scroll" style="padding-top:0">' +
        '<div class="chips">' + CATS.map(function (c) {
          return '<button class="chip ' + (state.cat === c ? 'on' : '') + '" data-act="cat" data-val="' + c + '">' + c + '</button>';
        }).join('') + '</div>' +
        '<div style="height:12px"></div>' +
        '<div class="grid">' + tiles(list) + '</div>' +
        (list.length ? '' : emptyState('这个分类还空着', '换个分类看看')) +
        '<div style="height:16px"></div>' +
      '</div>' + uTab('category');
  };

  function promoBlock(p, qty) {
    var tier = tierFor(p, qty);
    var next = p.promo.tiers.filter(function (t) { return t.min > qty; }).sort(function (a, b) { return a.min - b.min; })[0];
    var hint = tier
      ? (next ? '再买 ' + (next.min - qty) + ' 件享 ' + offLabel(next.off) : '已享最低档')
      : ('满 ' + p.promo.tiers[0].min + ' 件享 ' + offLabel(p.promo.tiers[0].off));
    var rows = p.promo.tiers.map(function (t) {
      return '<div class="tier-row ' + (tier && tier.min === t.min ? 'on' : '') + '"><span>满 ' + t.min + ' 件</span><b>' + offLabel(t.off) + '</b></div>';
    }).join('');
    return '<div class="promo-wrap">' +
      '<div class="promo-banner"><div class="pb-l"><b>限时折扣</b><em>' + hint + '</em></div>' +
        '<div class="pb-r"><small>距结束</small><b class="cd" data-end="' + p.promo.end + 'T23:59:59">--:--:--</b></div></div>' +
      '<div class="tier-table">' + rows + '</div></div>';
  }

  VIEWS.user.product = function () {
    var p = byId(state.productId) || PRODUCTS[0];

    var qty = state.pd.qty;
    var tier = tierFor(p, qty);
    var unit = unitPrice(p, qty, pack);
    var offer = pack === 1 ? p.secondItemOffer : null;
    var offerLabel = offer ? secondItemLabel(offer) : '';
    var onSale = promoActive(p);
    var shape = p.tone === 't2' ? 'g' : (p.tone === 't3' ? 'y' : '');
    var reviews = p.reviews.length ? p.reviews.map(function (r) {
      return '<div class="review"><span class="av">' + r[0] + '</span><div><b>' + r[0] + '同学</b><p>' + r[1] + '</p></div></div>';
    }).join('') : '<p class="pd-desc">还没有评价，买一个试试。</p>';
    return statusbar() +
      '<div class="scroll" style="padding-top:0">' +
        '<div class="pd-hero"><button class="back" data-act="back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>' +
          '<span class="tagpill">' + esc(offerLabel || p.tag) + '</span>' + productPhoto(p.image, p.name, '<span class="shape ' + shape + '"></span>') + '</div>' +
        '<div class="pd-card"><h2 class="h-serif">' + esc(p.name) + '</h2><div class="sub">' + esc(p.spec) + ' · 已售 ' + p.sold + ' 件</div>' +
          '<div class="pd-price"><b>' + money(unit) + '</b>' +
          (onSale ? '<small>' + money(base) + '</small>' : (p.old ? '<small>' + money(p.old) + '</small>' : '')) +
          (onSale || !offer ? '<span class="save">' + (onSale ? (tier ? offLabel(tier.off) : '促销') : esc(p.tag)) + '</span>' : '') + '</div>' +
          (offer ? '<div class="co-line"><span>商品小计 · 单件规格每两件享' + offerLabel + '</span><b>' + money(lineSubtotal(p, qty, pack)) + '</b></div>' : '') +
          (onSale ? promoBlock(p, qty) : '') + '</div>' +
        '<div class="pd-block"><div class="bh"><b>规格</b><span>可选</span></div><div class="specs">' +
          ['单件', '三件装'].map(function (s) {
            return '<button class="' + (state.pd.spec === s ? 'on' : '') + '" data-act="pdSpec" data-val="' + s + '">' + s + '</button>';
          }).join('') +
        '</div></div>' +
        '<div class="pd-block"><div class="bh"><b>购买数量</b><span>库存充足</span></div>' +
          '<div class="stepper"><button data-act="pdQty" data-val="-1">−</button><b id="pdQty">' + state.pd.qty + '</b><button data-act="pdQty" data-val="1">＋</button></div></div>' +
        '<div class="pd-block card"><div class="bh"><b>商品说明</b><span>北苑仓现货</span></div><p class="pd-desc">' + esc(p.desc) + '</p></div>' +
        '<div class="pd-block card"><div class="bh"><b>同学评价</b><span>' + p.reviews.length + ' 条</span></div>' + reviews + '</div>' +
        '<div style="height:14px"></div>' +
      '</div>' +
      '<div class="pd-bar"><div class="stepper"><button data-act="pdQty" data-val="-1">−</button><b>' + state.pd.qty + '</b><button data-act="pdQty" data-val="1">＋</button></div>' +
        '<button class="btn primary" data-act="pdAdd">加入购物袋</button>' +
        '<button class="btn red" data-act="buyNow">立即买</button></div>';
  };

  VIEWS.user.cart = function () {
    if (!state.cart.length) {
      return statusbar() + nav('购物袋', '0 件') +
        '<div class="scroll" style="padding-top:0">' + emptyState('购物袋还是空的', '去首页挑点吃的，宿舍常备都在那儿', '<button class="btn primary" data-act="tab" data-val="home">去逛逛</button>') + '</div>' + uTab('home');
    }
    var rows = state.cart.map(function (c, i) {
      var p = byId(c.id);
      var subtotal = lineSubtotal(p, c.qty, c.pack);
      var baseSubtotal = packBase(p, c.pack) * c.qty;
      return '<div class="cart-row"><span class="check ' + (c.checked ? 'on' : '') + '" data-act="cartCheck" data-val="' + i + '"></span>' +
        '<div class="cart-thumb ' + p.tone + '">' + productPhoto(p.image, p.name, '<span></span>') + '</div>' +
        '<div class="cart-info"><b>' + esc(p.name) + (subtotal < baseSubtotal ? ' <em class="sale-tag">促</em>' : '') + '</b><small>' + (c.pack === 3 ? '三件装 · ' : '') + esc(p.spec) + '</small></div>' +
        '<div class="cart-right"><span class="p">' + money(subtotal) + '</span>' +
        '<span class="stepper"><button data-act="cartQty" data-val="' + i + ':-1">−</button><b>' + c.qty + '</b><button data-act="cartQty" data-val="' + i + ':1">＋</button></span></div></div>';
    }).join('');
    var allchecked = state.cart.every(function (c) { return c.checked; });
    return statusbar() + nav('购物袋', cartCount() + ' 件') +
      '<div class="scroll" style="padding-top:0">' +
        '<div class="row-between" style="padding:4px 0 2px"><span class="small muted">北苑仓 · 30 分钟送达</span>' +
          '<span class="small muted" data-act="soon" data-val="演示版：清空失效商品">清空失效</span></div>' +
        rows +
        '<div style="height:10px"></div>' +
      '</div>' +
      '<div class="cart-foot"><span class="check ' + (allchecked ? 'on' : '') + '" data-act="cartAll"></span>' +
        '<span class="small muted">全选</span>' +
        '<span class="sum">合计<b>' + money(cartTotal()) + '</b></span>' +
        '<button class="btn red" data-act="checkout">去结算（' + checkedCount() + '）</button></div>';
  };

  VIEWS.user.checkout = function () {
    var addr = state.me.addrs[state.checkout.addrIndex];
    var items = state.cart.filter(function (c) { return c.checked; });
    var subtotal = cartTotal();
    var fee = state.station.fee;
    var sum = subtotal + fee;
    var rows = items.map(function (c) {
      var p = byId(c.id);
      var amount = lineSubtotal(p, c.qty, c.pack);
      return '<div class="co-line"><span>' + esc(p.name) + (c.pack === 3 ? ' 三件装' : '') + ' × ' + c.qty + (amount < packBase(p, c.pack) * c.qty ? ' <em class="sale-tag">促</em>' : '') + '</span><b>' + money(amount) + '</b></div>';
    }).join('');
    var times = ['尽快送达（约 20 分钟）', '20:30 – 20:45', '21:00 – 21:15'];
    var pays = [['微信支付', '线上支付 · 立即扣款', '微'], ['货到付款', '送达时当面付款', '付']];
    return statusbar() + nav('确认订单', '共 ' + checkedCount() + ' 件') +
      '<div class="scroll" style="padding-top:0">' +
        '<div class="co-card co-addr" data-act="addrSheet"><span class="pin">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c3.6 0 6.4 2.8 6.4 6.3 0 4.4-6.4 10.2-6.4 10.2S5.6 13.7 5.6 9.3C5.6 5.8 8.4 3 12 3z"/><circle cx="12" cy="9.3" r="2.1"/></svg></span>' +
          '<div><b>' + (addr ? esc(addr.name) : '添加收货地址') + '</b><small>' + (addr ? esc(addr.sub) : '请选择送达位置') + '</small></div>' +
          '<span class="arrow"><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l5 5-5 5"/></svg></span></div>' +
        '<div class="co-card"><div class="co-h">送达时间</div><div class="chips">' + times.map(function (t) {
          return '<button class="chip ' + (state.checkout.time === t ? 'on' : '') + '" data-act="setTime" data-val="' + t + '">' + t + '</button>';
        }).join('') + '</div></div>' +
        '<div class="co-card"><div class="co-h">商品 ' + items.length + ' 件</div>' + rows +
          '<div class="co-line"><span>商品小计</span><b>' + money(subtotal) + '</b></div>' +
          '<div class="co-line"><span>配送费</span><b>' + money(fee) + '</b></div>' +
          '<div class="co-line total"><span>合计</span><b>' + money(sum) + '</b></div></div>' +
        '<div class="co-card"><div class="co-h">支付方式</div>' + pays.map(function (p) {
          return '<div class="pay-opt ' + (state.checkout.pay === p[0] ? 'on' : '') + '" data-act="setPay" data-val="' + p[0] + '">' +
            '<span class="radio"></span><span class="ic">' + p[2] + '</span>' +
            '<span class="pt"><b>' + p[0] + '</b><small>' + p[1] + '</small></span></div>';
        }).join('') + '</div>' +
        '<div class="co-card"><div class="co-h">备注</div><textarea class="note-input" data-input="note" placeholder="比如：放门口、不要辣、到了打电话">' + esc(state.checkout.note) + '</textarea></div>' +
        '<div class="co-card"><div class="co-h">配送信息</div><div class="co-line"><span>配送站点</span><b>北苑仓</b></div>' +
          '<div class="co-line"><span>预计送达</span><b>' + state.checkout.time + '</b></div></div>' +
        '<div style="height:8px"></div>' +
      '</div>' +
      '<div class="pd-bar"><div style="flex:1"><span class="small muted">应付</span><div style="font-size:19px;color:var(--red);font-weight:600">' + money(sum) + '</div></div>' +
          '<button class="btn red" data-act="' + (addr ? 'submit' : 'addrSheet') + '" style="flex:0 0 150px">' + (addr ? '提交订单' : '添加收货地址') + '</button></div>';
  };

  VIEWS.user.success = function () {
    var o = state.orders.filter(function (x) { return x.no === state.lastNo; })[0];
    return statusbar() +
      '<div class="done"><div class="stamp"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 12.5l5 5L20 6.5"/></svg></div>' +
        '<h2>下单成功</h2><p>订单 ' + (o ? o.no : '') + ' 已送到北苑仓<br>' + (o ? esc(o.addr) : '') + ' · ' +
          (o && o.pay === '货到付款' ? '货到付款，送达时支付' : '已支付 · 预计 20 分钟后送达') + '</p>' +
        '<div class="acts"><button class="btn ghost" data-act="tab" data-val="home">继续逛</button>' +
        '<button class="btn primary" data-act="go" data-val="orders">查看订单</button></div></div>' + homebar();
  };

  VIEWS.user.orders = function () {
    var tabs = ['全部', '进行中', '已完成'];
    var list = state.orders.filter(function (o) {
      if (state.orderTab === '进行中') return orderInProgress(o);
      if (state.orderTab === '已完成') return o.status === '已完成';
      return true;
    });
    var cards = list.map(function (o) {
      var count = o.items.reduce(function (a, i) { return a + i.qty; }, 0);
      var thumbs = o.items.slice(0, 3).map(function (it) {
        var p = byId(it.id);
        return '<span>' + productPhoto(p.image, p.name, '<i></i>') + '</span>';
      }).join('');
      var acts = o.status === '已完成'
        ? '<button class="btn sm" data-act="reorder" data-val="' + o.no + '">再来一单</button><button class="btn sm ghost" data-act="openOrder" data-val="' + o.no + '">查看详情</button>'
        : (orderInProgress(o) && o.status !== '配送中')
          ? '<button class="btn sm ghost" data-act="urge" data-val="' + o.no + '">催单</button>' +
            '<button class="btn sm ghost" data-act="cancelOrder" data-val="' + o.no + '">取消</button>' +
            '<button class="btn sm" data-act="openOrder" data-val="' + o.no + '">订单详情</button>'
          : (o.status === '已取消' || o.status === '已退款')
            ? '<button class="btn sm" data-act="reorder" data-val="' + o.no + '">重新下单</button><button class="btn sm ghost" data-act="openOrder" data-val="' + o.no + '">订单详情</button>'
            : '<button class="btn sm ghost" data-act="urge" data-val="' + o.no + '">催单</button>' +
              '<button class="btn sm ghost" data-act="contact">联系骑手</button>' +
              '<button class="btn sm" data-act="openOrder" data-val="' + o.no + '">订单详情</button>';
      return '<div class="ord" data-act="openOrder" data-val="' + o.no + '">' +
        '<div class="ord-h"><span class="no">' + o.no + '</span><span>' + o.time + '</span>' + pill(o.status) + '</div>' +
        '<div class="ord-items"><div class="thumbs">' + thumbs + '</div><span class="meta">共 ' + count + ' 件</span>' +
          '<div class="total"><b>' + money(orderTotal(o)) + '</b><small>' + esc(o.addr) + '</small></div></div>' +
        '<div class="ord-acts">' + acts + '</div></div>';
    }).join('');
    return statusbar() +
      '<div class="scroll" style="padding-top:2px">' +
        '<h1 class="h-serif" style="font-size:22px;padding:4px 0 14px">我的订单</h1>' +
        '<div class="seg">' + tabs.map(function (t) {
          return '<button class="' + (state.orderTab === t ? 'on' : '') + '" data-act="orderTab" data-val="' + t + '">' + t + '</button>';
        }).join('') + '</div>' +
        (cards || emptyState('这里还没有订单', '去首页下第一单吧', '<button class="btn primary" data-act="tab" data-val="home">去下单</button>')) +
        '<div style="height:14px"></div>' +
      '</div>' + uTab('orders');
  };

  VIEWS.user.order = function () {
    var o = state.orders.filter(function (x) { return x.no === state.detailNo; })[0];
    if (!o) return statusbar() + nav('订单详情') + '<div class="scroll">' + emptyState('订单不见了', '回到列表看看') + '</div>';
    var rows = o.items.map(function (it) {
      var p = byId(it.id);
      return '<div class="cart-row" style="border:0;padding:8px 0"><div class="cart-thumb ' + p.tone + '">' + productPhoto(p.image, p.name, '<span></span>') + '</div>' +
        '<div class="cart-info"><b>' + esc(p.name) + '</b><small>' + esc(p.spec) + '</small></div>' +
        '<div class="cart-right"><span class="p">' + money(orderItemSubtotal(it)) + '</span><small class="muted">×' + it.qty + '</small></div></div>';
    }).join('');
    var acts = o.status === '已完成'
      ? '<button class="btn block" data-act="reorder" data-val="' + o.no + '">再来一单</button><button class="btn block ghost" data-act="soon" data-val="演示版：评价晒单">评价</button>'
      : (o.status === '已取消' || o.status === '已退款')
        ? '<button class="btn block" data-act="reorder" data-val="' + o.no + '">重新下单</button>'
        : '<button class="btn block ghost" data-act="urge" data-val="' + o.no + '">催单</button>' +
          '<button class="btn block ghost" data-act="contact">联系骑手</button>' +
          '<button class="btn block" data-act="cancelOrder" data-val="' + o.no + '">取消订单</button>';
    return statusbar() + nav('订单详情', o.no) +
      '<div class="scroll" style="padding-top:0">' +
        '<div class="card" style="margin-bottom:11px"><div class="ord-h" style="margin-bottom:8px"><span class="no">' + o.no + '</span>' + pill(o.status) + '</div>' +
          logsHtml(o) + '</div>' +
        '<div class="card" style="margin-bottom:11px"><div class="co-h">配送信息</div>' +
          '<div class="co-line"><span>收货地址</span><b>' + esc(o.addr) + '</b></div>' +
          '<div class="co-line"><span>骑手</span><b>' + o.rider + '</b></div>' +
          '<div class="co-line"><span>支付方式</span><b>' + o.pay + (o.pay === '货到付款' ? (o.status === '已完成' ? ' · 已收款' : ' · 送达时收取') : ' · 已支付') + '</b></div>' +
          '<div class="co-line"><span>备注</span><b>' + (esc(o.note) || '无') + '</b></div></div>' +
        '<div class="card" style="margin-bottom:11px"><div class="co-h">商品</div>' + rows +
          '<div class="co-line"><span>商品小计</span><b>' + money(orderSubtotal(o)) + '</b></div>' +
          '<div class="co-line"><span>配送费</span><b>' + money(o.deliveryFee || 0) + '</b></div>' +
          '<div class="co-line total"><span>' + (o.pay === '货到付款' && o.status !== '已完成' ? '应付' : '实付') + '</span><b>' + money(orderTotal(o)) + '</b></div></div>' +
        '<div style="display:flex;gap:9px;margin-top:14px">' + acts + '</div>' +
        '<div style="height:16px"></div>' +
      '</div>';
  };

  VIEWS.user.me = function () {
    var address = state.me.addrs[state.checkout.addrIndex];
    return statusbar() +
      '<div class="scroll" style="padding-top:6px">' +
        '<div class="me-head"><div class="av">满</div><div><b>小满</b><small>北苑 3 号楼 · 2023 级 软件工程</small></div></div>' +
        '<div class="me-stats"><div><b>' + state.orders.length + '</b><span>订单</span></div>' +
          '<div><b>' + state.me.coupons + '</b><span>优惠券</span></div>' +
          '<div><b>' + state.me.points + '</b><span>积分</span></div></div>' +
        '<div class="card" style="margin-top:12px;padding:4px 14px">' +
          '<div class="row" data-act="addrSheet" style="cursor:pointer"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c3.6 0 6.4 2.8 6.4 6.3 0 4.4-6.4 10.2-6.4 10.2S5.6 13.7 5.6 9.3C5.6 5.8 8.4 3 12 3z"/><circle cx="12" cy="9.3" r="2.1"/></svg></span><div><b>收货地址</b><small>' + (address ? esc(address.name) : '添加收货地址') + '</small></div><span class="rt">管理 →</span></div>' +
          '<div class="row" data-act="soon" data-val="演示版：优惠券包"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/></svg></span><div><b>优惠券</b><small>' + state.me.coupons + ' 张可用</small></div><span class="rt">去看看 →</span></div>' +
          '<div class="row" data-act="soon" data-val="演示版：联系客服"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11H8l-4 4z"/></svg></span><div><b>联系客服</b><small>在线时间 09:00–24:00</small></div><span class="rt">→</span></div>' +
          '<div class="row" data-act="soon" data-val="演示版：设置"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg></span><div><b>设置</b><small>通知、隐私、账号</small></div><span class="rt">→</span></div>' +
        '</div>' +
        '<div class="note" style="margin-top:14px"><span class="tape"></span><div class="nt"><h3 class="h-serif">这个月吃了 12 单</h3><span>省下 36 块</span></div>' +
          '<p>常点：脆浪薯片、白桃气泡水。建议把宿舍常备加进常买清单。</p>' +
          '<div class="row"><span class="mini">积分 +128</span><span class="mini">环保袋 0 次</span></div></div>' +
        '<div style="height:16px"></div>' +
      '</div>' + uTab('me');
  };
})();
</script>
<script>
/* 配送端 */
(function () {
  function dTab(active) {
    var items = [
      ['hall', '任务', '<path d="M4 6h16M4 12h16M4 18h10"/>'],
      ['orders', '订单', '<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8"/>'],
      ['income', '收入', '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/>'],
      ['me', '我的', '<circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c1-3.6 3.9-5.6 7.2-5.6s6.2 2 7.2 5.6"/>']
    ];
    return '<nav class="tabbar">' + items.map(function (it) {
      var on = active === it[0] || (active === 'task' && it[0] === 'hall');
      return '<button class="' + (on ? 'on' : '') + '"' + (on ? ' aria-current="page"' : '') + ' data-act="tab" data-val="' + it[0] + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">' + it[2] + '</svg>' + it[1] +
        (it[0] === 'hall' && unreadMsg() ? '<span class="task-alert-dot" aria-label="有未读催单"></span>' : '') + '</button>';
    }).join('') + '</nav>' + homebar();
  }

  function paymentFilter() {
    var options = [['all', '全部付款方式'], ['cod', '货到付款'], ['paid', '线上已付款']];
    return '<label class="pay-filter">付款方式<select data-input="riderPayFilter">' + options.map(function (option) {
      return '<option value="' + option[0] + '"' + (state.deliver.payFilter === option[0] ? ' selected' : '') + '>' + option[1] + '</option>';
    }).join('') + '</select></label>';
  }
  function taskPayment(no) {
    return taskIsCOD(no) ? '<span class="task-payment cod">货到付款</span>' : '<span class="task-payment">线上已付款</span>';
  }
  function ticket(a, stage) {
    var steps = ['取货', '配送', '送达'];
    var alert = stage < 2 ? orderUrgency(a.no) : null;
    var order = orderByNo(a.no);
    return '<div class="ticket' + (alert && !alert.read ? ' ticket-urgent' : '') + '">' +
      urgencyHtml(alert) +
      '<div class="tk-top"><span class="id">#' + esc(a.no) + ' · ' + esc(a.at) + ' 接单</span><span class="task-status">' + ['待取货', '配送中', '已送达'][stage] + '</span></div>' +
      '<div class="tk-title"><h3>' + esc(a.addr) + '</h3><p>' + (a.eta && stage < 2 ? '预计 ' + esc(a.eta) + ' 送达 · ' : '') + esc(a.km) + ' · ' + a.items + ' 件</p></div>' +
      '<div class="tk-dash"></div>' +
      '<div style="padding:0 14px"><div class="d-steps">' + steps.map(function (s, i) {
        var cls = i < stage ? 'on' : (i === stage ? 'now' : '');
        return '<div class="d-step ' + cls + '"><i></i>' + s + '</div>';
      }).join('') + '</div></div>' +
      '<div class="tk-route">' +
        '<div class="row" style="border:0;padding:6px 0"><span class="ic" style="width:26px;height:26px;border-radius:9px;background:rgba(53,102,79,.1);color:var(--green)">取</span>' +
          '<div><b>北苑仓 A-12 货架</b><small>' + (stage > 0 ? '已取货 · 商品已核对' : '待取货 · 报单号 ' + a.no) + '</small></div></div>' +
        '<div class="row" style="border:0;padding:6px 0"><span class="ic" style="width:26px;height:26px;border-radius:9px;background:rgba(217,96,58,.12);color:var(--red)">送</span>' +
          '<div><b>' + esc(a.addr) + '</b><small>' + (order && order.note ? '备注：' + esc(order.note) : '无配送备注') + '</small></div></div>' +
      '</div>' +
      '<div class="tk-dash"></div>' +
      '<div class="tk-foot"><div class="sum"><b>' + a.items + ' 件商品</b>配送费 ' + money(a.fee) + '</div>' + taskPayment(a.no) + '</div></div>';
  }

  VIEWS.delivery.hall = function () {
    var d = state.deliver;
    var available = d.avail.filter(taskMatchesPayment);
    var active = d.tasks.find(function (t) { return t.stage < 2; });
    var capacity = riderCapacity();
    var avail = available.map(function (t) {
      var selected = d.claimSelection.includes(t.no);
      return '<div class="avail">' + selectionButton('claimSelect', t.no, d.claimSelection, !d.online || (!selected && d.claimSelection.length >= capacity)) +
        '<div class="avail-info"><b>' + esc(t.addr) + '</b><small>' + esc(t.no + ' · ' + t.items + ' 件 · ' + t.tag) + '</small>' + taskPayment(t.no) + '</div>' +
        '<div class="fee"><b>+' + money(t.fee) + '</b><span>配送费</span></div>' +
        batchButton('accept', '接单', !d.online || !capacity, t.id) + '</div>';
    }).join('');
    return statusbar() +
      '<div class="scroll" style="padding-top:4px">' +
        '<div class="d-top"><div class="who">北苑站 · 配送手账<b class="h-serif">' + (active ? '当前任务' : '待接单') + '</b></div>' +
          '<div style="display:flex;align-items:center;gap:7px">' +
            '<button class="bell" data-act="dMsg" aria-label="消息提醒">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>' +
              '<span class="bell-badge" id="msgBadge" style="display:' + (unreadMsg() ? 'grid' : 'none') + '">' + unreadMsg() + '</span>' +
            '</button>' +
            '<button class="d-switch ' + (d.online ? '' : 'off') + '" data-act="dOnline"><i></i>' + (d.online ? '接单中' : '已收工') + '</button>' +
          '</div></div>' +
        (active ? ticket(active, active.stage) +
          '<button class="btn primary block task-action" data-act="openTask" data-val="' + active.no + '">查看当前任务 →</button>'
          : '<div class="card"><b>暂无进行中的任务</b><p class="small muted">' + (d.online ? '附近有 ' + d.avail.length + ' 单待接' : '已收工') + '</p></div>') +
        '<button class="alert-entry" data-act="alertSettings">催单提醒设置 <span>' + (alertPrefs.armed && (alertPrefs.voice || alertPrefs.vibrate) ? '管理震动与语音' : '文字提醒') + ' ›</span></button>' +
        '<div class="sechead"><h2>附近可接 <small>' + available.length + ' 单</small></h2>' +
          '<button class="refresh" data-act="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 5v6h-6"/></svg>刷新<span id="refreshHint">10s</span></button></div>' +
        paymentFilter() + '<div class="batch-tools"><span aria-live="polite">已选 ' + d.claimSelection.length + ' 单 · 还可接 ' + capacity + ' 单</span>' +
          batchButton('claimBatch', '批量接单', !d.online || !d.claimSelection.length || d.claimSelection.length > capacity) + '</div>' +
        (avail || '<p class="small muted" style="padding:6px 0 14px">暂无符合条件的待接任务。</p>') +
        '<div class="divider"><span>今日记录</span><i></i></div>' +

  VIEWS.delivery.task = function () {
    var d = state.deliver;

  function dCard(o) {

      '<div class="df"><span>' + count + ' 件 · ' + o.pay + '</span><b>' + money(orderTotal(o)) + '</b></div></div>';

  function dListHtml() {
    var list = dOrders();
    return list.length ? list.map(dCard).join('') : emptyState('没有符合条件的订单', '换个关键词或时间范围试试');

  VIEWS.delivery.orders = function () {

          '<input data-input="dorder" value="' + esc(state.deliver.q) + '" placeholder="订单号 / 手机号 / 收货人 / 地址">' +
        '</div>' +

          '<button class="btn primary block" style="margin-top:12px" data-act="withdraw">提现到微信</button></div>' +
        '<div class="card" style="margin-top:12px"><div class="co-h">今日明细</div>' + rows + '</div>' +

          '<p>再送 3 单就能拿到 60 块全勤奖，今晚还有 2 小时。</p><div class="row"><span class="mini">已送 27 单</span><span class="mini">目标 30 单</span></div></div>' +

  VIEWS.delivery.me = function () {
