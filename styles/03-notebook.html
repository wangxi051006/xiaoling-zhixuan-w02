<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NO.03 手账 · 校零智选 视觉方向</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:#0B0B09;color:#E8E5DC;font-family:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;padding:0 0 90px}
a{color:inherit;text-decoration:none}
.back{position:fixed;top:22px;left:26px;z-index:50;font-size:12px;letter-spacing:.08em;color:#8C8A80;border:1px solid #2A2A24;padding:7px 12px;border-radius:2px;background:rgba(11,11,9,.7);backdrop-filter:blur(8px)}
.back:hover{color:#E8E5DC;border-color:#4A4A40}
.spec{max-width:1660px;margin:0 auto;padding:74px 56px 36px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:60px;border-bottom:1px solid #1D1D18}
.eyebrow{font-size:11px;letter-spacing:.28em;color:#7E7C72;margin-bottom:18px}
.spec h1{font-size:82px;line-height:.9;letter-spacing:-.045em;font-weight:900}
.spec h1 em{font-style:normal;color:#D9603A}
.spec .lead{margin-top:22px;font-size:15px;line-height:1.85;color:#A9A69B;max-width:560px}
.tags{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.tags span{font-size:11px;letter-spacing:.06em;padding:5px 10px;border:1px solid #33332C;color:#B4B1A6;border-radius:2px}
.tokens{border:1px solid #1D1D18;padding:26px;align-self:start;background:#0E0E0C}
.tokens h3{font-size:11px;letter-spacing:.24em;color:#7E7C72;font-weight:600;margin-bottom:18px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.sw div{font-size:10px;letter-spacing:.04em;color:#8C8A80}
.sw i{display:block;height:44px;border:1px solid rgba(255,255,255,.14);margin-bottom:7px}
.sw b{display:block;color:#D8D5CA;font-weight:600;font-size:11px;margin-bottom:2px}
.dl{display:grid;grid-template-columns:78px 1fr;gap:9px 14px;font-size:12px;border-top:1px solid #1D1D18;padding-top:18px}
.dl dt{color:#71706A;letter-spacing:.06em}
.dl dd{color:#D8D5CA}
.stage{max-width:1700px;margin:0 auto;padding:64px 56px 20px;display:flex;gap:44px;align-items:flex-start;overflow-x:auto;scroll-snap-type:x proximity}
.col{flex:0 0 auto;scroll-snap-align:center}
.col figcaption{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;padding-left:8px}
.col figcaption b{font-size:13px;letter-spacing:.02em;color:#E8E5DC;font-weight:600}
.col figcaption span{font-size:11px;color:#6F6D64;letter-spacing:.06em}
.phone{position:relative;width:390px;height:844px;border-radius:56px;padding:11px;background:linear-gradient(150deg,#2C2C27,#111110 45%,#232320);box-shadow:0 40px 80px -34px rgba(0,0,0,.95),0 0 0 1px #3A3A33,inset 0 0 0 1px rgba(255,255,255,.04)}
.island{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:112px;height:26px;border-radius:14px;background:#080807;z-index:40}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;display:flex;flex-direction:column}
.sb{flex:0 0 auto;height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 7px;font-size:13px;font-weight:700;position:relative;z-index:20}
.sb-r{display:flex;align-items:center;gap:5px}
.sb-r svg{display:block}
.serif{font-family:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif}

/* ================= C 手账 ================= */
.screen.c{background:#FBF5EA;color:#2E2A24;--paper:#FBF5EA;--card:#FFFDF8;--ink:#2E2A24;--mu:#8B8175;--red:#D9603A;--green:#35664F;--butter:#F0C24E}
.c .ctop{flex:0 0 auto;padding:6px 22px 0;display:flex;align-items:flex-start;justify-content:space-between}
.c .hi{font-size:11px;color:var(--mu);letter-spacing:.04em}
.c .hi b{font-size:21px;color:var(--ink);display:block;margin-top:4px;letter-spacing:.01em;font-weight:400}
.c .avatar{width:38px;height:38px;border-radius:50%;background:var(--green);color:#FFF7E9;display:grid;place-items:center;font-size:14px;position:relative}
.c .avatar::after{content:"";position:absolute;inset:-4px;border:1px dashed rgba(53,102,79,.4);border-radius:50%}
.c .where{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:10.5px;color:var(--mu);background:rgba(255,253,248,.8);border:1px solid rgba(46,42,36,.1);padding:6px 10px;border-radius:999px;width:fit-content}
.c .where b{color:var(--ink);font-weight:600}
.c .where .t{margin-left:1px;color:var(--red)}
.c .csearch{flex:0 0 auto;margin:12px 22px 0;height:44px;border-radius:999px;background:var(--card);border:1px solid rgba(46,42,36,.14);display:flex;align-items:center;gap:9px;padding:0 14px;font-size:12px;color:#A29888;box-shadow:0 6px 16px -12px rgba(90,70,40,.8)}
.c .csearch .go{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff}

.c .catrow{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:16px 18px 0}
.c .cat{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:9.5px;color:#6B6255;letter-spacing:.02em}
.c .cat i{width:46px;height:46px;border-radius:16px;background:var(--card);border:1px solid rgba(46,42,36,.12);display:grid;place-items:center;position:relative}
.c .cat i::after{content:"";position:absolute;inset:4px;border:1px dashed rgba(46,42,36,.11);border-radius:12px}
.c .cat svg{width:19px;height:19px;color:var(--green);position:relative;z-index:1}
.c .cat:nth-child(2) svg{color:var(--red)}
.c .cat:nth-child(3) svg{color:#B8892F}

.c .note{flex:0 0 auto;margin:16px 22px 0;background:#FFF7E4;border:1px solid rgba(46,42,36,.12);border-radius:16px;padding:14px 15px;position:relative;box-shadow:0 14px 26px -22px rgba(90,70,40,.9)}
.c .tape{position:absolute;top:-9px;left:26px;width:66px;height:18px;background:rgba(240,194,78,.5);transform:rotate(-3deg);border-left:1px solid rgba(255,255,255,.5);border-right:1px solid rgba(255,255,255,.5)}
.c .note .nt{display:flex;align-items:baseline;justify-content:space-between}
.c .note h3{font-size:16px;font-weight:600;letter-spacing:.01em}
.c .note .nt span{font-size:9.5px;color:var(--red);letter-spacing:.06em}
.c .note p{font-size:10.5px;color:#7E7466;margin-top:6px;line-height:1.6}
.c .note .row{display:flex;align-items:center;gap:7px;margin-top:11px}
.c .note .mini{font-size:9px;letter-spacing:.04em;border:1px dashed rgba(46,42,36,.25);border-radius:6px;padding:4px 7px;color:#6B6255}
.c .note .cta{margin-left:auto;font-size:10px;font-weight:600;color:#FFF7E9;background:var(--red);border-radius:999px;padding:6px 12px}

.c .sechead{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;padding:16px 22px 10px}
.c .sechead h2{font-size:16px;font-weight:600;letter-spacing:.01em}
.c .sechead h2 small{font-size:9px;color:var(--mu);margin-left:6px;letter-spacing:.08em;font-weight:400}
.c .sechead a{font-size:10px;color:var(--mu);letter-spacing:.02em}

.c .grid2{flex:1 1 auto;padding:0 22px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:9px;overflow:hidden}
.c .pcard{background:var(--card);border:1px solid rgba(46,42,36,.1);border-radius:16px;padding:8px;position:relative;display:flex;flex-direction:column;min-height:0}
.c .pimg{height:auto;flex:1 1 auto;min-height:38px;border-radius:11px;background:#F3ECDD;position:relative;overflow:hidden;display:grid;place-items:center}
.c .pimg span{width:26px;height:26px;background:var(--red);border-radius:7px;opacity:.85}
.c .p2 .pimg span{background:var(--green);border-radius:50%}
.c .p3 .pimg span{background:var(--butter);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
.c .p4 .pimg span{background:#6B8FA8;border-radius:3px;transform:rotate(18deg);width:22px}
.c .pimg u{position:absolute;right:7px;top:7px;font-size:8px;text-decoration:none;background:rgba(255,253,248,.9);border:1px solid rgba(46,42,36,.12);color:#7E7466;padding:2px 4px;border-radius:4px;letter-spacing:.02em}
.c .pcard b{display:block;font-size:11.5px;font-weight:600;margin-top:7px;letter-spacing:.01em}
.c .pcard small{display:block;font-size:8.5px;color:var(--mu);margin-top:3px}
.c .pcard .pr{display:flex;align-items:baseline;gap:3px;margin-top:5px}
.c .pcard .pr span{font-size:9px;color:var(--red)}
.c .pcard .pr b{font-size:15px;margin:0;color:var(--red);font-weight:600}
.c .pcard .pr .add{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1px solid rgba(46,42,36,.2);display:grid;place-items:center;font-size:12px;color:#5F5749;background:#FFFDF8}

.c .ctab{flex:0 0 auto;height:74px;margin:0 12px 10px;border-radius:22px;background:rgba(255,253,248,.96);border:1px solid rgba(46,42,36,.1);display:grid;grid-template-columns:repeat(4,1fr);padding-top:10px;box-shadow:0 12px 26px -24px rgba(60,45,20,1)}
.c .ctab a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;color:#9C9284;letter-spacing:.04em}
.c .ctab a.on{color:var(--red)}
.c .ctab svg{width:20px;height:20px}
.c .ctab a.on::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--red);position:absolute;margin-top:-8px}
.c .homebar{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:126px;height:4px;border-radius:2px;background:rgba(46,42,36,.35)}

/* 配送端 */
.c .dhead{flex:0 0 auto;padding:8px 22px 0;display:flex;align-items:center;justify-content:space-between}
.c .dhead .who{font-size:10.5px;color:var(--mu)}
.c .dhead .who b{display:block;font-size:15px;color:var(--ink);margin-top:3px;font-weight:600}
.c .pill-live{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--green);border:1px solid rgba(53,102,79,.3);background:rgba(53,102,79,.07);padding:5px 9px;border-radius:999px}
.c .pill-live i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.c .dbrief{flex:0 0 auto;display:flex;gap:8px;padding:14px 22px 0}
.c .dbrief div{flex:1;background:var(--card);border:1px solid rgba(46,42,36,.1);border-radius:14px;padding:9px 10px}
.c .dbrief span{font-size:8.5px;color:var(--mu);letter-spacing:.04em}
.c .dbrief b{display:block;font-size:17px;margin-top:5px;font-weight:600;letter-spacing:-.01em}
.c .dbrief b i{font-style:normal;font-size:9px;color:var(--mu);margin-right:1px}

.c .ticket{flex:0 0 auto;margin:14px 22px 0;background:var(--card);border:1px solid rgba(46,42,36,.14);border-radius:18px;position:relative;box-shadow:0 18px 30px -28px rgba(60,45,20,1);overflow:hidden}
.c .ticket::before,.c .ticket::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#FBF5EA;border:1px solid rgba(46,42,36,.14);top:96px}
.c .ticket::before{left:-8px}
.c .ticket::after{right:-8px}
.c .tk-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0}
.c .tk-top .id{font-size:10px;color:var(--mu);letter-spacing:.06em}
.c .stamp{transform:rotate(-6deg);border:1.5px solid var(--red);color:var(--red);font-size:9px;letter-spacing:.14em;padding:3px 6px;border-radius:4px;font-weight:600}
.c .tk-title{padding:8px 14px 0}
.c .tk-title h3{font-size:20px;font-weight:600;letter-spacing:.01em}
.c .tk-title p{font-size:10px;color:var(--mu);margin-top:5px}
.c .dash{height:1px;margin:12px 14px;border-top:1px dashed rgba(46,42,36,.24)}
.c .tk-route{padding:0 14px}
.c .rk{display:flex;gap:10px;align-items:flex-start}
.c .rk .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--green);flex:0 0 auto;margin-top:3px}
.c .rk .dot.end{border-color:var(--red);background:var(--red)}
.c .rk b{font-size:11.5px;font-weight:600;display:block}
.c .rk small{font-size:9px;color:var(--mu);display:block;margin-top:3px;line-height:1.5}
.c .rk-line{height:18px;border-left:1px dashed rgba(46,42,36,.3);margin:2px 0 2px 4px}
.c .tk-foot{display:flex;align-items:center;gap:10px;padding:12px 14px 14px}
.c .tk-foot .sum{font-size:9px;color:var(--mu);line-height:1.5}
.c .tk-foot .sum b{display:block;color:var(--ink);font-size:11px}
.c .btn-c{height:42px;border-radius:999px;border:1px solid var(--green);background:var(--green);color:#FFF7E9;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:0 18px;margin-left:auto;cursor:pointer}
.c .btn-c.ghost{background:transparent;color:#5F5749;border-color:rgba(46,42,36,.22);padding:0 14px;margin-left:0;font-weight:500}

.c .helper{flex:1 1 auto;padding:0 22px;overflow:hidden}
.c .helper .h{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 8px}
.c .helper .h b{font-size:12.5px;font-weight:600}
.c .helper .h span{font-size:9px;color:var(--mu)}
.c .hcard{display:flex;align-items:center;gap:9px;background:rgba(255,253,248,.72);border:1px dashed rgba(46,42,36,.2);border-radius:12px;padding:9px 11px;margin-bottom:7px}
.c .hcard b{font-size:11px;font-weight:600}
.c .hcard small{display:block;font-size:9px;color:var(--mu);margin-top:2px}
.c .hcard .fee{margin-left:auto;font-size:12px;color:var(--green);font-weight:600}

/* 管理端 */
.c .ahead{flex:0 0 auto;padding:8px 22px 0}
.c .ahead .k{font-size:9px;letter-spacing:.16em;color:var(--mu)}
.c .ahead h1{font-size:24px;font-weight:400;letter-spacing:.02em;margin-top:5px;display:flex;align-items:center;gap:9px}
.c .ahead h1 span{font-size:9px;letter-spacing:.06em;color:var(--green);border:1px solid rgba(53,102,79,.35);border-radius:999px;padding:3px 7px;font-family:"PingFang SC",sans-serif;font-weight:500}
.c .notes{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 22px 0}
.c .ncard{border-radius:16px;padding:11px 12px;border:1px solid rgba(46,42,36,.1);background:var(--card);position:relative}
.c .ncard:nth-child(1){background:#FFF3D6;transform:rotate(-.8deg)}
.c .ncard:nth-child(2){background:#EAF1E7;transform:rotate(.7deg)}
.c .ncard:nth-child(3){background:#FFFDF8}
.c .ncard:nth-child(4){background:#FBEDE5;transform:rotate(-.4deg)}
.c .ncard span{font-size:8.5px;color:#7E7466;letter-spacing:.06em;display:flex;justify-content:space-between}
.c .ncard span i{font-style:normal;color:var(--green);font-weight:600}
.c .ncard b{display:block;font-size:22px;margin-top:8px;font-weight:600;letter-spacing:-.01em}
.c .ncard b i{font-style:normal;font-size:10px;color:#7E7466;margin-right:2px}
.c .ncard em{font-style:normal;font-size:8.5px;color:#8B8175;display:block;margin-top:5px}
.c .chartc{flex:0 0 auto;margin:12px 22px 0;background:var(--card);border:1px solid rgba(46,42,36,.1);border-radius:16px;padding:12px 13px}
.c .chartc .ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.c .chartc .ch b{font-size:11px;font-weight:600}
.c .chartc .ch span{font-size:8.5px;color:var(--mu)}
.c .cbars{display:flex;align-items:flex-end;gap:8px;height:72px;border-bottom:1px dashed rgba(46,42,36,.22);padding-bottom:0}
.c .cbars i{flex:1;background:#E7DFCE;border-radius:6px 6px 0 0;position:relative}
.c .cbars i.on{background:var(--red)}
.c .cbars i.on::after{content:"64";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--red)}
.c .cx{display:flex;gap:8px;margin-top:6px}
.c .cx span{flex:1;text-align:center;font-size:8px;color:#A29888}
.c .todo{flex:1 1 auto;margin:12px 22px 0;overflow:hidden}
.c .todo .th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.c .todo .th b{font-size:11px;font-weight:600}
.c .todo .th span{font-size:8.5px;color:var(--mu)}
.c .titem{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed rgba(46,42,36,.16);font-size:10px;color:#4F483D}
.c .chk{width:13px;height:13px;border-radius:4px;border:1.5px solid rgba(46,42,36,.3);flex:0 0 auto}
.c .chk.done{background:var(--green);border-color:var(--green);position:relative}
.c .chk.done::after{content:"";position:absolute;left:3px;top:0.5px;width:4px;height:7px;border:solid #FFF7E9;border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
.c .titem b{font-weight:600}
.c .titem span{margin-left:auto;font-size:8.5px;color:#A29888}

@media (max-width:900px){.spec{grid-template-columns:1fr;padding:64px 22px 28px;gap:32px}.spec h1{font-size:58px}.stage{padding:36px 22px 10px}}
@media (max-width:640px){.stage{flex-direction:column;align-items:center;overflow:visible;padding:30px 0 10px;gap:38px}.col figcaption{width:351px;margin:0 auto 16px;padding-left:0}.phone{transform:scale(.9);transform-origin:top center;margin-bottom:-84px}body>div:last-child>span:first-child{white-space:nowrap}}
</style>
</head>
<body>
<a class="back" href="../index.html">← 全部方向</a>

<section class="spec">
  <div>
    <p class="eyebrow">STYLE 03 — 手账 / NOTEBOOK</p>
    <h1>手账<em>.</em></h1>
    <p class="lead">奶油纸底、宋体标题、胶带和便签。把校园零售做得像一本随身手账：亲切但不幼稚，字体有呼吸感，信息像被人手写标注过一遍。</p>
    <div class="tags"><span>暖纸感</span><span>宋体标题</span><span>胶带便签</span><span>亲和</span></div>
  </div>
  <aside class="tokens">
    <h3>DESIGN TOKENS</h3>
    <div class="sw">
      <div><i style="background:#FBF5EA"></i><b>奶油纸</b>#FBF5EA</div>
      <div><i style="background:#FFFDF8"></i><b>卡片</b>#FFFDF8</div>
      <div><i style="background:#D9603A"></i><b>柿红</b>#D9603A</div>
      <div><i style="background:#35664F"></i><b>松绿</b>#35664F</div>
    </div>
    <dl class="dl">
      <dt>圆角</dt><dd>14–22px，胶囊按钮</dd>
      <dt>描边</dt><dd>1px rgba(46,42,36,.12)</dd>
      <dt>阴影</dt><dd>大范围低透明度暖色</dd>
      <dt>字体</dt><dd>宋体标题 + 苹方正文</dd>
      <dt>氛围</dt><dd>校园手账 / 贴纸 / 便签</dd>
    </dl>
  </aside>
</section>

<main class="stage">

  <!-- 用户端 -->
  <figure class="col">
    <figcaption><b>用户端</b><span>首页 · 今日推荐</span></figcaption>
    <div class="phone"><div class="island"></div><div class="screen c">
      <div class="sb" style="color:#2E2A24"><span>20:12</span><span class="sb-r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4"/><rect x="4.5" y="5" width="3" height="6"/><rect x="9" y="2.5" width="3" height="8.5"/><rect x="13.5" y="0" width="3" height="11"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4a9 9 0 0 1 13 0M3.6 6.6a5.6 5.6 0 0 1 7.8 0"/><circle cx="7.5" cy="9.6" r="1" fill="currentColor" stroke="none"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0.6" y="0.6" width="19" height="9.8" rx="2.4"/><rect x="2.4" y="2.4" width="13.6" height="6.2" fill="currentColor"/><path d="M21.6 4v3" stroke-width="1.6"/></svg>
      </span></div>

      <div class="ctop">
        <div class="hi">11 月 18 日 · 周二 · 有晚课<b class="serif">晚上好，小满</b></div>
        <div class="avatar serif">满</div>
      </div>
