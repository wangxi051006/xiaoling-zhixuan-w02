<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NO.04 白板 · 校零智选 视觉方向</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:#0B0B09;color:#E8E5DC;font-family:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;padding:0 0 90px}
a{color:inherit;text-decoration:none}
.back{position:fixed;top:22px;left:26px;z-index:50;font-size:12px;letter-spacing:.08em;color:#8C8A80;border:1px solid #2A2A24;padding:7px 12px;border-radius:2px;background:rgba(11,11,9,.7);backdrop-filter:blur(8px)}
.back:hover{color:#E8E5DC;border-color:#4A4A40}
.spec{max-width:1660px;margin:0 auto;padding:74px 56px 36px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:60px;border-bottom:1px solid #1D1D18}
.eyebrow{font-size:11px;letter-spacing:.28em;color:#7E7C72;margin-bottom:18px}
.spec h1{font-size:82px;line-height:.9;letter-spacing:-.045em;font-weight:900}
.spec h1 em{font-style:normal;color:#0E5F52}
.spec .lead{margin-top:22px;font-size:15px;line-height:1.85;color:#A9A69B;max-width:560px}
.tags{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.tags span{font-size:11px;letter-spacing:.06em;padding:5px 10px;border:1px solid #33332C;color:#B4B1A6;border-radius:2px}
.tokens{border:1px solid #1D1D18;padding:26px;align-self:start;background:#0E0E0C}
.tokens h3{font-size:11px;letter-spacing:.24em;color:#7E7C72;font-weight:600;margin-bottom:18px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.sw div{font-size:10px;letter-spacing:.04em;color:#8C8A80}
.sw i{display:block;height:44px;border:1px solid rgba(255,255,255,.14);margin-bottom:7px}
.sw b{display:block;color:#D8D5CA;font-weight:600;font-size:11px;margin-bottom:2px}
.dl{display:grid;grid-template-columns:78px 1fr;gap:9px 14px;font-size:12px;border-top:1px solid #1D1D18;padding-top:18px}
.dl dt{color:#71706A;letter-spacing:.06em}
.dl dd{color:#D8D5CA}
.stage{max-width:1700px;margin:0 auto;padding:64px 56px 20px;display:flex;gap:44px;align-items:flex-start;overflow-x:auto;scroll-snap-type:x proximity}
.col{flex:0 0 auto;scroll-snap-align:center}
.col figcaption{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;padding-left:8px}
.col figcaption b{font-size:13px;letter-spacing:.02em;color:#E8E5DC;font-weight:600}
.col figcaption span{font-size:11px;color:#6F6D64;letter-spacing:.06em}
.phone{position:relative;width:390px;height:844px;border-radius:56px;padding:11px;background:linear-gradient(150deg,#2C2C27,#111110 45%,#232320);box-shadow:0 40px 80px -34px rgba(0,0,0,.95),0 0 0 1px #3A3A33,inset 0 0 0 1px rgba(255,255,255,.04)}
.island{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:112px;height:26px;border-radius:14px;background:#080807;z-index:40}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;display:flex;flex-direction:column}
.sb{flex:0 0 auto;height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 7px;font-size:13px;font-weight:700;position:relative;z-index:20}
.sb-r{display:flex;align-items:center;gap:5px}
.sb-r svg{display:block}

/* ================= D 白板 ================= */
.screen.d{background:#F4F5F2;color:#111413;--bg:#F4F5F2;--card:#FFFFFF;--line:#E3E5DF;--ink:#111413;--mu:#6C7470;--teal:#0E5F52;--sig:#C9553A}
.d .dhead{flex:0 0 auto;padding:4px 20px 0;display:flex;align-items:center;justify-content:space-between}
.d .brand{display:flex;align-items:center;gap:7px}
.d .logo{width:20px;height:20px;border-radius:6px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.d .brand b{font-size:12px;letter-spacing:.02em}
.d .brand span{font-size:9px;color:var(--mu);border-left:1px solid #D5D8D2;padding-left:7px;margin-left:2px;letter-spacing:.04em}
.d .icobtn{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px;display:grid;place-items:center;color:#4E5651}
.d .seg{flex:0 0 auto;margin:12px 20px 0;display:flex;background:#E9EBE5;border-radius:8px;padding:3px}
.d .seg span{flex:1;text-align:center;font-size:11px;padding:6px 0;color:#5C645F;border-radius:6px;letter-spacing:.02em}
.d .seg span.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.d .search2{flex:0 0 auto;margin:10px 20px 0;height:38px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 11px;font-size:12px;color:#98A09A}
.d .search2 .rf{margin-left:auto;font-size:9px;color:#8A938C;letter-spacing:.06em}
.d .quick{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 20px 0}
.d .q{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9.5px;color:#4E5651;letter-spacing:.02em}
.d .q svg{width:17px;height:17px;color:var(--teal)}
.d .q:nth-child(2) svg{color:#B27A2B}
.d .sec2{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px 8px}
.d .sec2 h2{font-size:13px;font-weight:600;letter-spacing:.01em}
.d .sec2 h2 span{font-size:9px;color:var(--mu);font-weight:400;margin-left:6px;letter-spacing:.04em}
.d .sec2 a{font-size:10px;color:var(--teal);letter-spacing:.02em}
.d .lst{flex:1 1 auto;padding:0 20px;overflow:hidden}
.d .lrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #E8EAE5}
.d .lrow:last-child{border-bottom:0}
.d .thumb2{width:44px;height:44px;border-radius:8px;background:#EBEDE7;display:grid;place-items:center;flex:0 0 auto;position:relative}
.d .thumb2 i{width:17px;height:17px;border-radius:4px;background:var(--teal);opacity:.16}
.d .thumb2 b{position:absolute;font-size:9px;color:var(--teal);font-weight:600}
.d .lrow .nm b{font-size:12.5px;font-weight:500;display:block;letter-spacing:.01em}
.d .lrow .nm small{font-size:9.5px;color:var(--mu);display:block;margin-top:3px}
.d .lrow .pp{margin-left:auto;text-align:right}
.d .lrow .pp b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.d .lrow .pp b i{font-style:normal;font-size:9px;font-weight:400;color:var(--mu);margin-right:1px}
.d .step2{display:flex;align-items:center;gap:0;margin-left:10px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.d .step2 span{width:22px;height:22px;display:grid;place-items:center;font-size:11px;color:#5C645F}
.d .step2 b{width:20px;text-align:center;font-size:11px;font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:22px}
.d .cartbar{flex:0 0 auto;margin:10px 20px 0;height:48px;border-radius:10px;background:#141917;color:#F4F5F2;display:flex;align-items:center;padding:0 6px 0 14px;box-shadow:0 10px 20px -16px rgba(0,0,0,.9)}
.d .cartbar .cl{font-size:10.5px;color:#B9C1BB;letter-spacing:.02em}
.d .cartbar .cl b{color:#fff;font-size:13px;margin-right:6px}
.d .cartbar button{margin-left:auto;height:36px;padding:0 16px;border:0;border-radius:8px;background:#F0F2EE;color:#141917;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.d .dtab{flex:0 0 auto;height:70px;display:grid;grid-template-columns:repeat(4,1fr);padding-top:8px;border-top:1px solid var(--line);background:#fff;margin-top:10px}
.d .dtab a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;color:#9AA29B;letter-spacing:.03em}
.d .dtab a.on{color:var(--ink)}
.d .dtab svg{width:19px;height:19px}
.d .dtab a.on::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--teal);margin-top:-1px}
.d .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:126px;height:4px;border-radius:2px;background:rgba(17,20,19,.3)}

/* 配送端 */
.d .dtop2{flex:0 0 auto;padding:4px 20px 0;display:flex;align-items:center;justify-content:space-between}
.d .dtop2 .k{font-size:9px;letter-spacing:.14em;color:var(--mu)}
.d .dtop2 .v{font-size:13px;font-weight:600;margin-top:4px}
.d .switch{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--teal);border:1px solid rgba(14,95,82,.28);background:#EAF1EE;border-radius:999px;padding:5px 9px;letter-spacing:.03em}
.d .switch i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.d .stat3{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);margin:12px 20px 0;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.d .stat3 div{padding:10px 11px;border-right:1px solid var(--line)}
.d .stat3 div:last-child{border:0}
.d .stat3 span{font-size:8.5px;color:var(--mu);letter-spacing:.06em}
.d .stat3 b{display:block;font-size:17px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
.d .stat3 b i{font-style:normal;font-size:9px;color:var(--mu);margin-right:1px;font-weight:400}

.d .task{flex:0 0 auto;margin:12px 20px 0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.d .t-h{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);background:#FAFBF8}
.d .t-h .pill{font-size:8.5px;letter-spacing:.06em;color:#fff;background:var(--teal);border-radius:4px;padding:3px 6px;font-weight:600}
.d .t-h .oid{font-size:10px;color:var(--mu);font-variant-numeric:tabular-nums}
.d .t-h .clock{margin-left:auto;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.d .t-b{padding:12px 13px 0}
.d .addr{display:flex;gap:9px;position:relative;padding-bottom:14px}
.d .addr:last-child{padding-bottom:2px}
.d .addr .mk{width:16px;height:16px;border-radius:5px;border:1px solid #CFD4CE;display:grid;place-items:center;font-size:8px;color:#6C7470;flex:0 0 auto;background:#fff;position:relative;z-index:2}
.d .addr .mk.on{background:var(--teal);border-color:var(--teal);color:#fff}
.d .addr .ln{position:absolute;left:7.5px;top:16px;bottom:0;border-left:1px dashed #CFD4CE}
.d .addr b{font-size:11.5px;font-weight:600;display:block}
.d .addr small{font-size:9.5px;color:var(--mu);display:block;margin-top:3px;line-height:1.5}
.d .t-f{display:flex;gap:7px;padding:10px 13px;border-top:1px solid var(--line);margin-top:10px;background:#FAFBF8}
.d .btn-d{flex:1;height:38px;border-radius:8px;border:1px solid #D8DBD5;background:#fff;font-size:11.5px;color:#3B423E;font-weight:500;cursor:pointer}
.d .btn-d.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.d .pick{flex:1 1 auto;padding:0 20px;overflow:hidden}
.d .pick .ph{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 7px}
.d .pick .ph b{font-size:11px;font-weight:600;letter-spacing:.02em}
.d .pick .ph span{font-size:9px;color:var(--mu)}
.d .prow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #E8EAE5}
.d .prow b{font-size:11px;font-weight:500}
.d .prow small{display:block;font-size:9px;color:var(--mu);margin-top:2px}
.d .prow .fee{margin-left:auto;font-size:11px;font-weight:600;color:var(--teal);font-variant-numeric:tabular-nums}

/* 管理端 */
.d .ahead{flex:0 0 auto;padding:4px 20px 0;display:flex;align-items:flex-end;justify-content:space-between}
.d .ahead h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.d .ahead .k{font-size:9px;letter-spacing:.14em;color:var(--mu);margin-bottom:5px}
.d .range{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.d .range span{font-size:9.5px;padding:4px 8px;color:#6C7470;border-right:1px solid var(--line)}
.d .range span:last-child{border:0}
.d .range span.on{background:#141917;color:#fff}
.d .kpi2{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;margin:12px 20px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.d .kpi2 div{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.d .kpi2 div:nth-child(2n){border-right:0}
.d .kpi2 div:nth-child(n+3){border-bottom:0}
.d .kpi2 span{font-size:8.5px;color:var(--mu);letter-spacing:.06em;display:flex;justify-content:space-between}
.d .kpi2 span i{font-style:normal;color:var(--teal);font-weight:600;letter-spacing:.01em}
.d .kpi2 b{display:block;font-size:20px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.d .kpi2 b i{font-style:normal;font-size:9px;color:var(--mu);margin-right:1px;font-weight:400}

.d .spark{flex:0 0 auto;margin:12px 20px 0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px}
.d .spark .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.d .spark .sh b{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.d .spark .sh span{font-size:9px;color:var(--mu);font-variant-numeric:tabular-nums}
.d .spark svg{display:block;width:100%;height:58px}
.d .sx{display:flex;justify-content:space-between;margin-top:4px;font-size:8px;color:#A2A9A3;font-variant-numeric:tabular-nums}

.d .ord{flex:1 1 auto;margin:12px 20px 0;overflow:hidden}
.d .ord .oh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.d .ord .oh b{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.d .ord .oh a{font-size:9.5px;color:var(--teal)}
.d .orow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #E8EAE5;font-size:10px}
.d .orow .oid{font-variant-numeric:tabular-nums;color:var(--mu);width:44px;flex:0 0 auto}
.d .orow .who{font-weight:500}
.d .orow .st{font-size:8px;padding:2px 5px;border-radius:4px;letter-spacing:.04em}
.d .st.ok{background:#E7F0EC;color:#0E5F52}
.d .st.wait{background:#F3EEE2;color:#8A6A2F}
.d .st.late{background:#F7E9E5;color:#B4472C}
.d .orow .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.d .warnrow{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border:1px solid #EBDCD6;background:#FCF5F2;border-radius:8px;font-size:9.5px;color:#8A4B36}
.d .warnrow b{font-weight:600}

@media (max-width:900px){.spec{grid-template-columns:1fr;padding:64px 22px 28px;gap:32px}.spec h1{font-size:58px}.stage{padding:36px 22px 10px}}
@media (max-width:640px){.stage{flex-direction:column;align-items:center;overflow:visible;padding:30px 0 10px;gap:38px}.col figcaption{width:351px;margin:0 auto 16px;padding-left:0}.phone{transform:scale(.9);transform-origin:top center;margin-bottom:-84px}body>div:last-child>span:first-child{white-space:nowrap}}
</style>
</head>

<section class="spec">
  <div>
    <p class="eyebrow">STYLE 04 — 白板 / WHITEBOARD</p>
    <h1>白板<em>.</em></h1>
    <p class="lead">克制到底的工具体验：灰白底、发丝线、单一墨绿。没有一处装饰是无用的，四端共用同一套表格、状态胶囊和数字排版，管理端尤其好读。</p>
    <div class="tags"><span>极简工具</span><span>发丝分割线</span><span>单一强调色</span><span>高可读</span></div>
  </div>
  <aside class="tokens">
    <h3>DESIGN TOKENS</h3>
    <div class="sw">
      <div><i style="background:#F4F5F2"></i><b>灰白</b>#F4F5F2</div>
      <div><i style="background:#FFFFFF"></i><b>卡片</b>#FFFFFF</div>
      <div><i style="background:#0E5F52"></i><b>墨绿</b>#0E5F52</div>
      <div><i style="background:#C9553A"></i><b>信号红</b>#C9553A</div>
    </div>
    <dl class="dl">
      <dt>圆角</dt><dd>7–12px</dd>
      <dt>描边</dt><dd>1px #E3E5DF 发丝线</dd>
      <dt>阴影</dt><dd>基本不用，靠层级色</dd>
      <dt>字体</dt><dd>苹方 中黑 + 等宽数字</dd>
      <dt>氛围</dt><dd>运营工具 / 后台系统</dd>
    </dl>
  </aside>
</section>

<main class="stage">

  <!-- 用户端 -->
  <figure class="col">
    <figcaption><b>用户端</b><span>首页 · 常买清单</span></figcaption>
    <div class="phone"><div class="island"></div><div class="screen d">
      <div class="sb"><span>8:20</span><span class="sb-r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4"/><rect x="4.5" y="5" width="3" height="6"/><rect x="9" y="2.5" width="3" height="8.5"/><rect x="13.5" y="0" width="3" height="11"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4a9 9 0 0 1 13 0M3.6 6.6a5.6 5.6 0 0 1 7.8 0"/><circle cx="7.5" cy="9.6" r="1" fill="currentColor" stroke="none"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0.6" y="0.6" width="19" height="9.8" rx="2.4"/><rect x="2.4" y="2.4" width="13.6" height="6.2" fill="currentColor"/><path d="M21.6 4v3" stroke-width="1.6"/></svg>
      </span></div>

      <div class="dhead">
        <div class="brand"><span class="logo">零</span><b>校零智选</b><span>北苑仓</span></div>
        <span class="icobtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></span>
      </div>

      <div class="seg"><span class="on">配送到楼</span><span>到店自提</span></div>

      <div class="search2">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        搜索商品、品牌
        <span class="rf">扫码</span>
      </div>

      <div class="quick">
        <div class="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4l2.5 5 5.5.8-4 3.9 1 5.5L12 16.6 6.9 19.2l1-5.5-4-3.9L9.5 9z"/></svg>常买</div>
        <div class="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg>再来一单</div>
        <div class="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16v13H4z"/><path d="M8 7V5h8v2"/></svg>优惠券</div>
        <div class="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><path d="M9.5 12h5M12 9.5v5"/></svg>客服</div>
      </div>

      <div class="sec2"><h2>本周常买<span>共 24 件</span></h2><a>管理清单</a></div>

      <div class="lst">
        <div class="lrow">
          <div class="thumb2"><i></i><b>薯</b></div>
          <div class="nm"><b>脆浪 海盐薯片</b><small>68g · ¥6.5 / 件</small></div>
          <div class="step2"><span>−</span><b>1</b><span>+</span></div>
        </div>
        <div class="lrow">

<script>
(function(){
  document.querySelectorAll('nav a').forEach(function(el){

      el.classList.add('on');
    });
  });
  document.querySelectorAll('.g-add, .plus, .add').forEach(function(b){
    b.addEventListener('click', function(){
      var badge = document.querySelector('.badge');
      if (badge) badge.textContent = String(parseInt(badge.textContent || '0', 10) + 1);
      b.animate([{ transform: 'scale(.86)' }, { transform: 'scale(1)' }], { duration: 160, easing: 'ease-out' });
    });
  });
  document.querySelectorAll('button').forEach(function(b){
    if (b.textContent.trim() === '确认送达') {
      b.addEventListener('click', function(){
        b.textContent = '已送达 · 待评价';
        b.style.opacity = '.72';
      });
    }
  });
})();
