# DEVELOPMENT ONLY. No app/edge containers and no claim to model production TLS.
# Always use a fresh `docker compose -p p07-dev-<unique> ...` project.
services:
  postgres:
    image: postgres:18-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    environment:
      POSTGRES_DB: campus_p07_dev
      POSTGRES_USER: campus_p07_dev_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/dev_pg_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    secrets:
      - dev_pg_password
    ports:
      - "127.0.0.1:${DEV_PG_PORT:?set an unused nonproduction loopback port}:5432"
    networks:
      - private
    volumes:
      # PostgreSQL 18+ image stores its versioned PGDATA below this parent.
      - pg_dev_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U campus_p07_dev_owner -d campus_p07_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
    stop_grace_period: 30s
networks:
  private:
    internal: true
volumes:
  pg_dev_data:
secrets:
  dev_pg_password:
    file: ${DEV_PG_PASSWORD_FILE:?set an isolated nonproduction password file}
