name: P07 candidate CI and manual preparation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Prepare an approved candidate artifact; no deployment or publication
        type: boolean
        required: true
        default: false
      preparation_environment:
        description: Independent protected preparation context; neither option deploys
        type: choice
        options: [staging-preparation, production-preparation]
        required: true
        default: staging-preparation
permissions:
  contents: read
concurrency:
  group: p07-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  VITE_ENABLE_MOCK: 'false'
  CI: 'true'
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Official image index pinned from docker-library/repo-info; PostgreSQL 18.7.
        image: postgres:18-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
        env:
          POSTGRES_USER: p07_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: p07_test
        ports: ['55497:5432']
        options: >-
          --health-cmd "pg_isready -U p07_ci -d p07_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://p07_ci:isolated-ci-only@127.0.0.1:55497/p07_test?sslmode=disable
      CGO_ENABLED: '1'
      CC: gcc-13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version: '1.27.4', cache: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '26.13.1', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Require pinned toolchain and isolated test configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/backend
          test "$(go env GOVERSION)" = go1.27.4
          test "$(node --version)" = v26.13.1
          test "$(npm --version)" = 11.20.0
          test "$($CC -dumpfullversion)" = 13.3.0
          test -n "$TEST_DATABASE_URL"
          test -z "${DATABASE_URL:-}"
          test -z "${MIGRATION_DATABASE_URL:-}"
          go version > evidence/backend/toolchain.txt
          "$CC" --version >> evidence/backend/toolchain.txt
          psql "$TEST_DATABASE_URL" -Atc 'select version()' >> evidence/backend/toolchain.txt
      - name: CI gate unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap deploy/ci/gates.test.mjs deploy/ci/sbom.test.mjs deploy/ci/release-manifest.test.mjs deploy/scripts/split-static.test.mjs | tee evidence/backend/node-gates.tap
          node deploy/ci/gates.mjs tap evidence/backend/node-gates.tap 17
          node deploy/scripts/check-template-contract.mjs
      - name: P00 Go test, vet, race with C compiler, and real PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          go mod verify
          go test -json ./... | tee ../evidence/backend/test.jsonl
          node ../deploy/ci/gates.mjs go ../evidence/backend/test.jsonl 1
          go vet ./...
          go test -race -json ./... | tee ../evidence/backend/race.jsonl
          node ../deploy/ci/gates.mjs go ../evidence/backend/race.jsonl 1
          go test -tags=integration -json ./... | tee ../evidence/backend/integration.jsonl
          node ../deploy/ci/gates.mjs go ../evidence/backend/integration.jsonl 1 TestG1CombinedMigrationPrefixUpgradeAndReplay TestP05FullEmptyAndLegalPrefixUpgradeReplay
      - name: Required race check with real PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          go test -race -tags=integration -count=1 -json ./... | tee ../evidence/backend/integration-race.jsonl
          node ../deploy/ci/gates.mjs go ../evidence/backend/integration-race.jsonl 1 TestG1CombinedMigrationPrefixUpgradeAndReplay TestP05FullEmptyAndLegalPrefixUpgradeReplay
      - name: Explicit empty 000-060 and populated-prefix upgrade/replay
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          go test -tags=integration -json -count=1 -run '^(TestG1CombinedMigrationPrefixUpgradeAndReplay|TestP05FullEmptyAndLegalPrefixUpgradeReplay)$' ./internal/platform ./test/integration | tee ../evidence/backend/migrations.jsonl
          node ../deploy/ci/gates.mjs go ../evidence/backend/migrations.jsonl 2 TestG1CombinedMigrationPrefixUpgradeAndReplay TestP05FullEmptyAndLegalPrefixUpgradeReplay
      - name: OpenAPI and generated Go/TypeScript drift
        run: |
          node contracts/generate.mjs --check
          git diff --exit-code -- contracts/openapi.yaml web/src/shared/generated.ts backend/internal/contract/enums_generated.go
      - name: Preserve first PostgreSQL diagnostics on failure
        if: failure()
        run: docker logs '${{ job.services.postgres.id }}' > evidence/backend/postgres.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: 'p07-backend-${{ github.sha }}', path: evidence/backend, if-no-files-found: error, retention-days: 14}
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '26.13.1', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Locked browser and frontend dependencies
        run: |
          test "$(npm --version)" = 11.20.0
          mkdir -p evidence/frontend
          npm ci --prefix web
          node deploy/ci/install-tools.mjs browser-linux
          node web/node_modules/playwright-core/cli.js install-deps chromium
      - name: P00 frontend commands and explicit P06 MOCK roles/recovery
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm run typecheck
          npm test | tee ../evidence/frontend/unit.tap
          node ../deploy/ci/gates.mjs tap ../evidence/frontend/unit.tap 1
          npm run build
          npm run test:e2e | tee ../evidence/frontend/entries.tap
          node ../deploy/ci/gates.mjs tap ../evidence/frontend/entries.tap 3
          node --test --test-reporter=tap tests/p06-roles.e2e.mjs tests/p06-recovery.e2e.mjs | tee ../evidence/frontend/p06-mock.tap
          node ../deploy/ci/gates.mjs tap ../evidence/frontend/p06-mock.tap 21
      - name: Controller integrated HTML gate (placeholder is FAIL)
        run: node deploy/ci/gates.mjs wiring .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'p07-frontend-${{ github.sha }}', path: evidence/frontend, if-no-files-found: error, retention-days: 14}
  p06-real-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      P06_EVIDENCE_DIR: '${{ github.workspace }}/evidence/p06-real'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '26.13.1', cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.27.4', cache: false}
      - name: Install locked Windows browser and test-only PostgreSQL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((node --version) -ne 'v26.13.1' -or (npm --version) -ne '11.20.0'){throw 'wrong Node/npm'}
          npm ci --prefix web
          if($LASTEXITCODE){throw 'npm ci failed'}
          npm ci --prefix deploy/ci/windows-tools --ignore-scripts
          if($LASTEXITCODE){throw 'locked PostgreSQL package failed'}
          node deploy/ci/install-tools.mjs browser-windows
          if($LASTEXITCODE){throw 'locked browser failed'}
          ./deploy/ci/windows-postgres.ps1 start
      - name: Build synthetic issuer only inside isolated test module copy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $taskBackend=Join-Path $env:RUNNER_TEMP 'xiaoling-p06-test-module'
          Copy-Item -LiteralPath backend -Destination $taskBackend -Recurse
          $taskFixture=Join-Path $taskBackend 'cmd/p06-ci-fixture'
          New-Item -ItemType Directory -Path $taskFixture | Out-Null
          Copy-Item -LiteralPath web/tests/fixtures/p06_server.go -Destination (Join-Path $taskFixture 'main.go')
          $taskExe=Join-Path $env:RUNNER_TEMP 'p06-fixture.exe'
          Push-Location $taskBackend
          try {go build -trimpath -o $taskExe ./cmd/p06-ci-fixture; if($LASTEXITCODE){throw 'test fixture build failed'}} finally {Pop-Location}
          "P06_FIXTURE_EXECUTABLE=$taskExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Explicit P06 real business matrix, no skip/zero accepted
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(!$env:TEST_DATABASE_URL -or !$env:BROWSER_EXECUTABLE -or !$env:P06_FIXTURE_EXECUTABLE){throw 'BLOCKED: required real fixture configuration'}
          New-Item -ItemType Directory -Path evidence/p06-real -Force | Out-Null
          node deploy/ci/gates.mjs wiring .
          if($LASTEXITCODE){throw 'BLOCKED: controller HTML integration required before real business tests'}
          Push-Location web
          try {
            npm run build
            if($LASTEXITCODE){throw 'frontend build failed'}
            node --test --test-reporter=tap tests/p06-business.e2e.mjs 2>&1 | Tee-Object ../evidence/p06-real/business.tap
            if($LASTEXITCODE){throw 'P06 real business failed'}
          } finally {Pop-Location}
          node deploy/ci/gates.mjs tap evidence/p06-real/business.tap 16
          if($LASTEXITCODE){throw 'required matrix skipped, failed or empty'}
      - name: Required P08 COD ledger reconciliation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:P06_EVIDENCE_DIR = Join-Path $env:GITHUB_WORKSPACE 'evidence/p06-real/p08'
          New-Item -ItemType Directory -Path $env:P06_EVIDENCE_DIR -Force | Out-Null
          Push-Location web
          try {
            npm run --silent test:e2e:p08 2>&1 | Tee-Object ../evidence/p06-real/p08/cod.tap
            if($LASTEXITCODE){throw 'P08 COD reconciliation failed'}
          } finally {Pop-Location}
          node deploy/ci/gates.mjs tap evidence/p06-real/p08/cod.tap 4
          if($LASTEXITCODE){throw 'required P08 matrix skipped, failed or empty'}
      - name: Stop only this job's PostgreSQL
        if: always()
        shell: pwsh
        run: |
          $taskLog=Join-Path $env:RUNNER_TEMP 'xiaoling-p07-postgres.log'
          New-Item -ItemType Directory -Path evidence/p06-real -Force | Out-Null
          if(Test-Path -LiteralPath $taskLog){Copy-Item -LiteralPath $taskLog -Destination evidence/p06-real/postgres.log}
          ./deploy/ci/windows-postgres.ps1 stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'p07-p06-real-windows-${{ github.sha }}', path: evidence/p06-real, if-no-files-found: error, retention-days: 14}
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '26.13.1'}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.27.4', cache: false}
      - name: Install hash verified scanners and pinned govulncheck
        run: |
          node deploy/ci/install-tools.mjs gitleaks syft trivy
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          npm ci --prefix web
      - name: SEC-04 source, full dependency, history and SBOM scanning
        run: bash deploy/ci/scan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'p07-security-${{ github.sha }}', path: evidence/security, if-no-files-found: error, retention-days: 14}
  release-preparation:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_release && github.ref == 'refs/heads/main'
    needs: [backend, frontend, p06-real-windows, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Repository owners MUST configure required reviewers, protected main, and prevent self-review.
    # Naming an environment in YAML does not prove that remote approval protection exists.
    environment: ${{ inputs.preparation_environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '26.13.1'}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.27.4', cache: false}
      - name: Install release dependencies and hash verified scanners
        run: |
          npm ci --prefix web
          node deploy/ci/install-tools.mjs trivy
      - name: Reproducible candidate packaging twice, with version/migrations/SBOM
        shell: bash
        env:
          CANDIDATE_ID: '${{ github.sha }}'
          PREPARATION_ENVIRONMENT: '${{ inputs.preparation_environment }}'
        run: |
          set -euo pipefail
          mkdir -p evidence/release
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash deploy/ci/build-release.sh .p07-release-a
          bash deploy/ci/build-release.sh .p07-release-b
          diff -ru .p07-release-a .p07-release-b
          for side in a b; do
            (cd ".p07-release-$side" && sha256sum --strict -c SHA256SUMS)
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - -C ".p07-release-$side" . | gzip -n > ".p07-release-$side.tar.gz"
          done
          cmp .p07-release-a.tar.gz .p07-release-b.tar.gz
          sha256sum .p07-release-a.tar.gz .p07-release-b.tar.gz > evidence/release/dual-archive-sha256.txt
          verify_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verify_dir"' EXIT
          tar -xzf .p07-release-a.tar.gz -C "$verify_dir"
          diff -ru .p07-release-a "$verify_dir"
          (cd "$verify_dir" && sha256sum --strict -c SHA256SUMS)
          test -z "$(git status --porcelain --untracked-files=no)"
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output evidence/release/artifact-scan.json .p07-release-a
          trivy sbom --severity HIGH,CRITICAL --exit-code 1 --format json --output evidence/release/sbom-scan.json .p07-release-a/sbom.spdx.json
          trivy --version > evidence/release/vulnerability-db.txt
          mv .p07-release-a.tar.gz evidence/release/xiaoling-candidate.tar.gz
          sha256sum evidence/release/xiaoling-candidate.tar.gz > evidence/release/xiaoling-candidate.tar.gz.sha256
          cp .p07-release-a/{VERSION.json,SHA256SUMS,migrations.json,sbom.spdx.json,artifact-manifest.json} evidence/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'p07-prepared-candidate-${{ github.sha }}', path: evidence/release, if-no-files-found: error, retention-days: 14}
